<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="shortcut icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="apple-touch-icon" href="champion-tokens_new.png"/>
  <link rel="stylesheet" href="css/style.css?v=4.0.1788135215812"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="page-bg"></div>

  <!-- Loading screen -->
  <div class="page-loading" id="page-loading">
    <div class="spinner"></div>
    <span>Loading tournaments…</span>
  </div>

  <!-- Page content -->
  <main class="page-wrap" id="main-content">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;text-align:center;">
      <div style="font-size:2rem;font-weight:900;color:var(--gold-bright);letter-spacing:0.02em;display:flex;align-items:center;gap:12px;">
        <i data-lucide="refresh-cw" style="width:32px;height:32px;color:var(--gold-bright);"></i> Under update.
      </div>
    </div>
  </main>

  <!-- Firebase SDKs & Core Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js?v=3.8"></script>
  <script src="js/auth.js?v=4.0.1788135215812"></script>
  <script src="js/db.js?v=4.0.1788135215812"></script>
  <script src="js/nav.js?v=4.0.1788135215812"></script>

  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth().then(async (user) => {
        currentUser = user;
        injectNav('tournaments');
        const loadingEl = document.getElementById('page-loading');
        if (loadingEl) loadingEl.classList.add('hidden');
        if (window.lucide) lucide.createIcons();
      }).catch(err => {
        console.error('Auth error:', err);
        const loadingEl = document.getElementById('page-loading');
        if (loadingEl) loadingEl.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
