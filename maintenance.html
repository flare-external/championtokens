<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="shortcut icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="apple-touch-icon" href="champion-tokens_new.png"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none !important;
      border: none !important;
    }

    body {
      background: #000000 !important;
      color: #ffffff !important;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative;
    }

    .maintenance-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .maintenance-title {
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin: 0 0 32px 0;
      line-height: 1.1;
    }

    .timer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .timer-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 18px 22px;
      min-width: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-digits {
      font-size: 3rem;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      line-height: 1;
    }

    .timer-subtext {
      font-size: 0.65rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.1em;
      margin-top: 8px;
    }

    .timer-divider {
      font-size: 2rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.3);
      line-height: 1;
    }

    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 500px) {
      .maintenance-title {
        font-size: 2rem;
        margin-bottom: 24px;
      }
      .timer-card {
        min-width: 76px;
        padding: 14px 16px;
      }
      .timer-digits {
        font-size: 2.2rem;
      }
      .timer-container {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Animated background layer -->
  <div class="page-bg"></div>

  <!-- Floating animated icons -->
  <div class="floating-icons-layer">
    <i data-lucide="swords" class="floating-icon-item" style="top:15%;left:12%;width:38px;height:38px;animation-duration:8s;"></i>
    <i data-lucide="shield" class="floating-icon-item" style="top:70%;left:18%;width:34px;height:34px;animation-duration:11s;animation-delay:1s;"></i>
    <i data-lucide="trophy" class="floating-icon-item" style="top:25%;right:15%;width:42px;height:42px;animation-duration:9s;animation-delay:2s;"></i>
    <i data-lucide="crosshair" class="floating-icon-item" style="top:75%;right:18%;width:36px;height:36px;animation-duration:12s;animation-delay:3s;"></i>
    <i data-lucide="flame" class="floating-icon-item" style="top:45%;left:8%;width:30px;height:30px;animation-duration:7s;animation-delay:0.5s;"></i>
    <i data-lucide="zap" class="floating-icon-item" style="top:50%;right:8%;width:32px;height:32px;animation-duration:10s;animation-delay:1.5s;"></i>
  </div>

  <div class="ambient-glow"></div>

  <main class="maintenance-wrapper">
    <h1 class="maintenance-title">Under Maintenance</h1>

    <div class="timer-container">
      <div class="timer-card">
        <span class="timer-digits" id="timer-hours">10</span>
        <span class="timer-subtext">HOURS</span>
      </div>
      <span class="timer-divider">:</span>
      <div class="timer-card">
        <span class="timer-digits" id="timer-minutes">00</span>
        <span class="timer-subtext">MINUTES</span>
      </div>
      <span class="timer-divider">:</span>
      <div class="timer-card">
        <span class="timer-digits" id="timer-seconds">00</span>
        <span class="timer-subtext">SECONDS</span>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();

    const TARGET_TIME = 1787572838000; // 10 hours from publication

    function tick() {
      const now = Date.now();
      const diff = Math.max(0, TARGET_TIME - now);
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const hEl = document.getElementById('timer-hours');
      const mEl = document.getElementById('timer-minutes');
      const sEl = document.getElementById('timer-seconds');

      if (hEl) hEl.textContent = String(hours).padStart(2, '0');
      if (mEl) mEl.textContent = String(minutes).padStart(2, '0');
      if (sEl) sEl.textContent = String(seconds).padStart(2, '0');
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
