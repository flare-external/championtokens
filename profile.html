<head>

  <style>
    .pf-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      position: relative;
      z-index: 10;
    }

    /* Clean Profile Banner Card */
    .pf-banner-card {
      background: #08090c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Banner Backdrop Image */
    .pf-banner-cover {
      height: 105px;
      background: linear-gradient(135deg, #090c10 0%, #151a23 50%, #0d1117 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background-image 0.3s ease;
    }

    .pf-banner-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(83, 252, 24, 0.1), transparent 70%);
      pointer-events: none;
    }

    /* Banner Controls (Direct Edit & Change Banner) */
    .pf-banner-actions {
      position: absolute;
      top: 14px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    .pf-edit-profile-btn {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pf-edit-profile-btn:hover {
      background: rgba(83, 252, 24, 0.15);
      border-color: #53fc18;
      color: #53fc18;
    }

    /* Banner Body */
    .pf-banner-body {
      padding: 0 28px 24px;
      position: relative;
      z-index: 10;
    }

    /* Header Row: Avatar overlapping line + HUD Card */
    .pf-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
      position: relative;
      z-index: 5;
    }

    /* PFP with Kick Neon Border */
    .pf-avatar-wrap {
      margin-top: -45px;
      position: relative;
      z-index: 5;
    }

    .pf-avatar-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      border: 3.5px solid #53fc18;
      box-shadow: 0 0 25px rgba(83, 252, 24, 0.35);
      display: block;
    }

    /* User Info (High Stacking Context so Tooltips Never Render Behind Avatar) */
    .pf-user-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      z-index: 100;
    }

    .pf-username {
      font-family: 'Outfit', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      display: inline-block;
    }

    .pf-id-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .pf-copy-btn {
      background: transparent;
      border: none;
      color: #53fc18;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    .pf-copy-btn:hover {
      background: rgba(83, 252, 24, 0.1);
    }
  </style>
</head>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/ranked-nav.js"></script>
  <script>
    function getRankMeta(elo, isUnranked) {
      if (isUnranked || elo <= 0) {
        return { name: 'Unranked', icon: '/medal-ranks/svg/01-bronze.svg', eloDisplay: '0', place: '--', numPlace: 999 };
      }
      if (elo < 500) return { name: 'Bronze', icon: '/medal-ranks/svg/01-bronze.svg', eloDisplay: elo.toLocaleString(), place: '#2,180', numPlace: 2180 };
      if (elo < 1000) return { name: 'Silver', icon: '/medal-ranks/svg/02-silver.svg', eloDisplay: elo.toLocaleString(), place: '#1,040', numPlace: 1040 };
      if (elo < 1500) return { name: 'Gold', icon: '/medal-ranks/svg/03-gold.svg', eloDisplay: elo.toLocaleString(), place: '#612', numPlace: 612 };
      if (elo < 2000) return { name: 'Platinum', icon: '/medal-ranks/svg/04-platinum.svg', eloDisplay: elo.toLocaleString(), place: '#285', numPlace: 285 };
      if (elo < 2400) return { name: 'Diamond', icon: '/medal-ranks/svg/05-diamond.svg', eloDisplay: elo.toLocaleString(), place: '#118', numPlace: 118 };
      if (elo < 2700) return { name: 'Elite', icon: '/medal-ranks/svg/06-elite.svg', eloDisplay: elo.toLocaleString(), place: '#42', numPlace: 42 };
      if (elo < 3000) return { name: 'Champion', icon: '/medal-ranks/svg/07-champion.svg', eloDisplay: elo.toLocaleString(), place: '#14', numPlace: 14 };
      return { name: 'Unreal', icon: '/medal-ranks/svg/10-star.svg', eloDisplay: elo.toLocaleString(), place: '#1', numPlace: 1 };
    }

    function sanitizeTo12Digits(val) {
      if (!val) return null;
      const digits = String(val).replace(/\D/g, '');
      if (digits.length >= 12) return digits.slice(0, 12);
      return null;
    }

    // Automated Moderation Engine for Bio (No Bad Words, No Links)
    function inspectBioSafety(bioText) {
      if (!bioText) return { safe: true };

      // 1. Link / URL detection regex
      const linkRegex = /(https?:\/\/|www\.|\b[a-zA-Z0-9-]+\.(com|net|org|fun|gg|io|xyz|ru|to|co|tv|app|dev|me|live|info|biz)\b|discord\.gg|t\.me)/i;
      if (linkRegex.test(bioText)) {
        return { safe: false, reason: 'Automated Moderation: No external links or website URLs allowed.' };
      }

      // 2. Bad words / Profanity / Hate speech filter
      const badWords = [
        'fuck', 'shit', 'bitch', 'asshole', 'cunt', 'dick', 'pussy', 'nigger', 'nigga',
        'faggot', 'retard', 'whore', 'slut', 'kill yourself', 'kys', 'nazi', 'hitler',
        'porn', 'sex', 'rape', 'pedophile', 'gore', 'terrorist'
      ];

      const cleanLower = bioText.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
      for (const word of badWords) {
        const regex = new RegExp(`\\b${word}\\b`, 'i');
        if (regex.test(cleanLower)) {
          return { safe: false, reason: 'Automated Moderation: Prohibited or offensive language detected.' };
        }
      }

      return { safe: true };
    }

    // Automated Moderation Engine for Image (NSFW & Gore)
    async function inspectImageSafety(imgSrc, rawName = '') {
      const forbiddenKeywords = [
        'gore', 'blood', 'wound', 'death', 'murder', 'kill', 'suicide', 'corpse',
        'porn', 'nsfw', 'hentai', 'sex', 'xxx', 'nude', 'naked', 'penis', 'boobs',
        'vagina', 'swastika', 'nazi', 'beheading', 'violence', 'erotic'
      ];

      const combinedText = (rawName + ' ' + imgSrc).toLowerCase();
      for (const word of forbiddenKeywords) {
        if (combinedText.includes(word)) {
          return { safe: false, reason: `Safety Filter: Prohibited keyword "${word}" detected.` };
        }
      }

      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 100;
            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;

            let skinPixels = 0;
            let bloodPixels = 0;
            const totalPixels = size * size;

            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];

              if (r > 95 && g > 40 && b > 20 && (Math.max(r, g, b) - Math.min(r, g, b) > 15) && Math.abs(r - g) > 15 && r > g && r > b) {
                skinPixels++;
              }
              if (r > 150 && g < 50 && b < 50) {
                bloodPixels++;
              }
            }

            if (skinPixels / totalPixels > 0.42) {
              return resolve({ safe: false, reason: 'Automated Moderation: Image rejected for containing excessive skin exposure.' });
            }
            if (bloodPixels / totalPixels > 0.22) {
              return resolve({ safe: false, reason: 'Automated Moderation: Image rejected for containing graphic red/violent content.' });
            }
            resolve({ safe: true });
          } catch (e) {
            resolve({ safe: true });
          }
        };

        img.onerror = () => {
          resolve({ safe: false, reason: 'Failed to load image. Please verify file format.' });
        };

        img.src = imgSrc;
      });
    }

    function initProfile() {
      // 1. Resolve 12-digit Contender ID (Never discord:...)
      let contenderId = sanitizeTo12Digits(window.location.pathname);
      if (!contenderId) {
        contenderId = sanitizeTo12Digits(localStorage.getItem('ct_contender_id'));
      }

      let user = {
        id: contenderId || '112118831941',
        name: 'adrian',
        customName: '',
        tag: '',
        avatar: 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=120&auto=format&fit=crop&q=80'
      };

      const cached = localStorage.getItem('ct_user');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          user = Object.assign(user, parsed);
          const sanitizedId = sanitizeTo12Digits(user.id || user.uid);
          if (sanitizedId) user.id = sanitizedId;
        } catch (e) {}
      }

      if (!/^\d{12}$/.test(user.id)) {
        user.id = sanitizeTo12Digits(user.id) || Math.floor(100000000000 + Math.random() * 900000000000).toString();
      }
      localStorage.setItem('ct_contender_id', user.id);

      // 2. Custom Banner Loading
      const savedBanner = localStorage.getItem('ct_user_banner');
      const bannerCoverEl = document.getElementById('pf-banner-cover');
      if (savedBanner && bannerCoverEl) {
        bannerCoverEl.style.backgroundImage = `url('${savedBanner}')`;
      }

      // 3. Bio Setup
      const savedBio = localStorage.getItem('ct_user_bio');
      const bioEl = document.getElementById('pf-user-bio');
      if (bioEl) {
        if (savedBio && savedBio.trim()) {
          bioEl.textContent = savedBio;
          bioEl.style.fontStyle = 'normal';
          bioEl.style.color = '#cbd5e1';
        } else {
          bioEl.textContent = 'bio here.. or not? please. add. one.';
          bioEl.style.fontStyle = 'italic';
          bioEl.style.color = '#64748b';
        }
      }

      // 4. Real Combat Statistics
      const played = parseInt(user.matchesPlayed || localStorage.getItem('ct_stat_matches_played') || '0', 10);
      const won = parseInt(user.matchesWon || localStorage.getItem('ct_stat_matches_won') || '0', 10);
      const wr = played > 0 ? ((won / played) * 100).toFixed(1) + '%' : '0.0%';
      const kd = user.kdRatio || localStorage.getItem('ct_stat_kd_ratio') || (played > 0 ? (won * 1.5 / Math.max(1, played - won)).toFixed(2) : '0.00');
      const mode = user.favoriteMode || localStorage.getItem('ct_stat_fav_mode') || 'Realistic 1v1';

      const statWonEl = document.getElementById('stat-won');
      const statPlayedEl = document.getElementById('stat-played');
      const statWrEl = document.getElementById('stat-wr');
      const statKdEl = document.getElementById('stat-kd');
      const statModeEl = document.getElementById('stat-mode');

      if (statWonEl) statWonEl.textContent = won.toLocaleString();
      if (statPlayedEl) statPlayedEl.textContent = played.toLocaleString();
      if (statWrEl) statWrEl.textContent = wr;
      if (statKdEl) statKdEl.textContent = kd;
      if (statModeEl) statModeEl.textContent = mode;

      // Season filter coming soon notification
      document.getElementById('btn-season-filter')?.addEventListener('click', () => {
        showToast('Season filtering is coming soon in Season 2!');
      });

      // 5. ELO & Rank Data
      const savedElo = localStorage.getItem('ct_user_elo');
      const isUnranked = localStorage.getItem('ct_is_unranked') === 'true';
      const elo = savedElo !== null ? parseInt(savedElo, 10) : 9999;
      const meta = getRankMeta(elo, isUnranked);

      const displayName = user.customName || user.displayName || user.name || 'adrian';
      const nameEl = document.getElementById('pf-display-name');
      const idEl = document.getElementById('pf-contender-id');
      const avatarEl = document.getElementById('pf-avatar');

      if (nameEl) nameEl.textContent = displayName;
      if (idEl) idEl.textContent = user.id;
      if (avatarEl && user.avatar) avatarEl.src = user.avatar;

      // 6. Compact HUD Values
      const hudRankEl = document.getElementById('pf-hud-rank');
      const hudIconEl = document.getElementById('pf-hud-icon');
      const hudPlaceEl = document.getElementById('pf-hud-place');
      const hudEloEl = document.getElementById('pf-hud-elo');
      const hudCardEl = document.getElementById('pf-hud-card');

      if (hudRankEl) hudRankEl.textContent = meta.name;
      if (hudIconEl) hudIconEl.src = meta.icon;
      if (hudPlaceEl) hudPlaceEl.textContent = meta.place;
      if (hudEloEl) hudEloEl.textContent = meta.eloDisplay;

      if (hudCardEl) {
        if (meta.numPlace <= 50) {
          hudCardEl.classList.add('top-50');
        } else {
          hudCardEl.classList.remove('top-50');
        }
      }

      // 7. Copy ID Handler
      document.getElementById('btn-copy-id')?.addEventListener('click', () => {
        navigator.clipboard.writeText(user.id).then(() => {
          showToast('Contender ID copied to clipboard!');
        });
      });

      // 8. Direct Inline Bio Editor (No Popups!)
      const bioDisplay = document.getElementById('pf-bio-display');
      const bioForm = document.getElementById('pf-bio-edit-form');
      const bioInput = document.getElementById('input-inline-bio');
      const bioCounter = document.getElementById('bio-char-count');
      const bioAlert = document.getElementById('bio-inline-mod-alert');
      const saveBioBtn = document.getElementById('btn-save-inline-bio');
      const cancelBioBtn = document.getElementById('btn-cancel-inline-bio');
      const openBioBtn = document.getElementById('btn-open-edit-profile');
      const triggerBioBtn = document.getElementById('btn-trigger-bio-edit');

      function enterBioEdit() {
        bioDisplay.style.display = 'none';
        bioForm.style.display = 'block';
        bioAlert.style.display = 'none';
        bioAlert.textContent = '';
        const cur = localStorage.getItem('ct_user_bio') || '';
        bioInput.value = cur;
        bioCounter.textContent = `${cur.length}/140`;
        bioInput.focus();
      }

      function exitBioEdit() {
        bioForm.style.display = 'none';
        bioDisplay.style.display = 'inline-flex';
        bioAlert.style.display = 'none';
      }

      bioDisplay?.addEventListener('click', enterBioEdit);
      triggerBioBtn?.addEventListener('click', (e) => { e.stopPropagation(); enterBioEdit(); });
      openBioBtn?.addEventListener('click', enterBioEdit);
      cancelBioBtn?.addEventListener('click', exitBioEdit);

      bioInput?.addEventListener('input', () => {
        bioCounter.textContent = `${bioInput.value.length}/140`;
        bioAlert.style.display = 'none';
      });

      saveBioBtn?.addEventListener('click', () => {
        const val = bioInput.value.trim();

        if (val) {
          const check = inspectBioSafety(val);
          if (!check.safe) {
            bioAlert.textContent = check.reason;
            bioAlert.style.display = 'block';
            return;
          }
          localStorage.setItem('ct_user_bio', val);
          bioEl.textContent = val;
          bioEl.style.fontStyle = 'normal';
          bioEl.style.color = '#cbd5e1';
        } else {
          localStorage.removeItem('ct_user_bio');
          bioEl.textContent = 'bio here.. or not? please. add. one.';
          bioEl.style.fontStyle = 'italic';
          bioEl.style.color = '#64748b';
        }

        exitBioEdit();
        showToast('Bio updated!');
      });

      // 9. Direct Banner Change (No Popups!)
      const directBannerBtn = document.getElementById('btn-change-banner-direct');
      const directBannerInput = document.getElementById('input-direct-banner');

      directBannerBtn?.addEventListener('click', () => {
        directBannerInput.click();
      });

      directBannerInput?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        showToast('Scanning banner with automated safety moderation...');

        const reader = new FileReader();
        reader.onload = async (re) => {
          const imgData = re.target.result;
          const result = await inspectImageSafety(imgData, file.name);

          if (!result.safe) {
            alert(result.reason);
            return;
          }

          localStorage.setItem('ct_user_banner', imgData);
          if (bannerCoverEl) {
            bannerCoverEl.style.backgroundImage = `url('${imgData}')`;
          }
          showToast('Banner updated successfully!');
        };
        reader.readAsDataURL(file);
      });

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', initProfile);

    function showToast(msg) {
      let toast = document.getElementById('pf-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'pf-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }
  </script>
</body>
</html>
