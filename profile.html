<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contender Profile — Champion Tokens</title>
  <link rel="icon" type="image/png" href="/champion-tokens_new.png"/>
  <link rel="stylesheet" href="/css/style.css?v=5.5"/>
  <link rel="stylesheet" href="/css/ranked.css?v=4.4"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="/js/protect.js"></script>
  <style>
    .pf-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 20px 80px;
      position: relative;
      z-index: 10;
    }

    /* Clean Profile Banner Card */
    .pf-banner-card {
      background: #08090c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Banner Backdrop Image */
    .pf-banner-cover {
      height: 180px;
      background: linear-gradient(180deg, rgba(8, 9, 12, 0.2) 0%, #08090c 100%),
                  url('/realistic.jpeg') center/cover no-repeat;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .pf-banner-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(83, 252, 24, 0.15), transparent 70%);
      pointer-events: none;
    }

    /* Banner Body */
    .pf-banner-body {
      padding: 0 32px 36px;
      position: relative;
    }

    .pf-profile-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: -55px;
    }

    .pf-user-left {
      display: flex;
      align-items: flex-end;
      gap: 22px;
    }

    /* PFP with Kick Neon Border */
    .pf-avatar-wrap {
      position: relative;
    }

    .pf-avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      border: 3.5px solid #53fc18;
      box-shadow: 0 0 25px rgba(83, 252, 24, 0.35);
      display: block;
    }

    .pf-user-meta {
      padding-bottom: 6px;
    }

    .pf-username {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 6px;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pf-id-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .pf-copy-btn {
      background: transparent;
      border: none;
      color: #53fc18;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    .pf-copy-btn:hover {
      background: rgba(83, 252, 24, 0.1);
    }

    /* Rank & ELO Badge Card */
    .pf-rank-box {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .pf-rank-emblem {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(83, 252, 24, 0.25));
    }

    .pf-rank-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pf-rank-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .pf-rank-place {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #fbbf24;
      line-height: 1;
    }

    .pf-rank-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .pf-rank-elo {
      font-size: 0.85rem;
      font-weight: 600;
      color: #53fc18;
    }
  </style>
</head>
<body data-ct-page="profile" style="background:#000000;color:#ffffff;margin:0;font-family:'Inter',sans-serif;">

  <!-- Main Profile Container -->
  <main class="pf-container">

    <!-- Profile Banner & Identity Card -->
    <section class="pf-banner-card">
      <!-- Backdrop Banner Cover -->
      <div class="pf-banner-cover"></div>

      <!-- Banner Body: Avatar, Name, Contender ID, Rank & ELO -->
      <div class="pf-banner-body">
        <div class="pf-profile-flex">
          
          <!-- Left: PFP, Username, 12-Digit Contender ID -->
          <div class="pf-user-left">
            <div class="pf-avatar-wrap">
              <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=120&auto=format&fit=crop&q=80" id="pf-avatar" class="pf-avatar-img" alt="Contender Avatar"/>
            </div>

            <div class="pf-user-meta">
              <div class="pf-username">
                <span id="pf-display-name">Zenox#1337</span>
              </div>
              <div class="pf-id-row">
                <span>Contender ID: <strong style="color:#ffffff;" id="pf-contender-id">882194017402</strong></span>
                <button type="button" class="pf-copy-btn" id="btn-copy-id" title="Copy Contender ID">
                  <i data-lucide="copy" style="width:14px;height:14px;"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Right: Competitive Rank, #Leaderboard Place & ELO Badge -->
          <div class="pf-rank-box">
            <img src="/medal-ranks/svg/10-star.svg" id="pf-rank-icon" class="pf-rank-emblem" alt="Rank Emblem"/>
            <div class="pf-rank-details">
              <div class="pf-rank-header">
                <span class="pf-rank-place" id="pf-rank-place">#1</span>
                <span class="pf-rank-title" id="pf-rank-title">Unreal Tier</span>
              </div>
              <span class="pf-rank-elo" id="pf-rank-elo">9,999 ELO</span>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- Universal Pinned Bottom Bar -->
  <footer class="ct-footer">
    <div style="font-size:0.75rem;color:#475569;">
      © 2026 Champion Tokens • Protected by Cloudflare
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/ranked-nav.js"></script>
  <script>
    function getRankMeta(elo, isUnranked) {
      if (isUnranked || elo <= 0) {
        return { name: 'Unranked', icon: '/medal-ranks/svg/01-bronze.svg', eloDisplay: '0/5 Placements', place: '--' };
      }
      if (elo < 500) return { name: 'Bronze', icon: '/medal-ranks/svg/01-bronze.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#2,180' };
      if (elo < 1000) return { name: 'Silver', icon: '/medal-ranks/svg/02-silver.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#1,040' };
      if (elo < 1500) return { name: 'Gold', icon: '/medal-ranks/svg/03-gold.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#612' };
      if (elo < 2000) return { name: 'Platinum', icon: '/medal-ranks/svg/04-platinum.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#285' };
      if (elo < 2400) return { name: 'Diamond', icon: '/medal-ranks/svg/05-diamond.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#118' };
      if (elo < 2700) return { name: 'Elite', icon: '/medal-ranks/svg/06-elite.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#42' };
      if (elo < 3000) return { name: 'Champion', icon: '/medal-ranks/svg/07-champion.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#14' };
      return { name: 'Unreal', icon: '/medal-ranks/svg/10-star.svg', eloDisplay: `${elo.toLocaleString()} ELO`, place: '#1' };
    }

    function sanitizeTo12Digits(val) {
      if (!val) return null;
      const digits = String(val).replace(/\D/g, '');
      if (digits.length >= 12) return digits.slice(0, 12);
      return null;
    }

    function initProfile() {
      // 1. Resolve 12-digit Contender ID (Never discord:...)
      let contenderId = sanitizeTo12Digits(window.location.pathname);
      if (!contenderId) {
        contenderId = sanitizeTo12Digits(localStorage.getItem('ct_contender_id'));
      }

      let user = {
        id: contenderId || '882194017402',
        name: 'Zenox',
        customName: '',
        tag: '#1337',
        avatar: 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=120&auto=format&fit=crop&q=80'
      };

      const cached = localStorage.getItem('ct_user');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          user = Object.assign(user, parsed);
          const sanitizedId = sanitizeTo12Digits(user.id || user.uid);
          if (sanitizedId) user.id = sanitizedId;
        } catch (e) {}
      }

      // Guarantee exactly 12 digits
      if (!/^\d{12}$/.test(user.id)) {
        user.id = sanitizeTo12Digits(user.id) || Math.floor(100000000000 + Math.random() * 900000000000).toString();
      }
      localStorage.setItem('ct_contender_id', user.id);

      const savedElo = localStorage.getItem('ct_user_elo');
      const isUnranked = localStorage.getItem('ct_is_unranked') === 'true';
      const elo = savedElo !== null ? parseInt(savedElo, 10) : 9999;
      const meta = getRankMeta(elo, isUnranked);

      const displayName = user.customName || user.displayName || `${user.name || 'Contender'}${user.tag || ''}`;
      const nameEl = document.getElementById('pf-display-name');
      const idEl = document.getElementById('pf-contender-id');
      const avatarEl = document.getElementById('pf-avatar');
      const rankIconEl = document.getElementById('pf-rank-icon');
      const rankPlaceEl = document.getElementById('pf-rank-place');
      const rankTitleEl = document.getElementById('pf-rank-title');
      const rankEloEl = document.getElementById('pf-rank-elo');

      if (nameEl) nameEl.textContent = displayName;
      if (idEl) idEl.textContent = user.id;
      if (avatarEl && user.avatar) avatarEl.src = user.avatar;
      if (rankIconEl) rankIconEl.src = meta.icon;
      if (rankPlaceEl) rankPlaceEl.textContent = meta.place;
      if (rankTitleEl) rankTitleEl.textContent = `${meta.name} Tier`;
      if (rankEloEl) rankEloEl.textContent = meta.eloDisplay;

      // Copy ID handler
      document.getElementById('btn-copy-id')?.addEventListener('click', () => {
        navigator.clipboard.writeText(user.id).then(() => {
          showToast('Contender ID copied to clipboard!');
        });
      });

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', initProfile);

    function showToast(msg) {
      let toast = document.getElementById('pf-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'pf-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }
  </script>
</body>
</html>
