<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile & Account — Champion Tokens</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    .matches-history { display: flex; flex-direction: column; gap: 12px; }
    .mh-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mh-card:hover { background: var(--bg-card-hover); border-color: var(--gold-bright); }
    .mh-status-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }
    .mh-status-icon i { width: 18px; height: 18px; }
    .mh-info { flex: 1; min-width: 0; }
    .mh-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mh-meta  { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    /* Epic Games Account Box */
    .epic-banner-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12) 0%, rgba(245, 158, 11, 0.05) 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 24px;
    }
    .epic-tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: var(--radius-sm);
      padding: 4px 12px;
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* Team Card Styling */
    .team-banner-card {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(245, 158, 11, 0.05) 100%);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 24px;
    }
    .team-roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .team-member-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-md);
      padding: 10px 14px;
    }
    .team-member-pfp {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg-card-hover);
      border: 1.5px solid var(--border-bright);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700;
      color: var(--gold-bright);
      flex-shrink: 0;
    }
    .team-member-pfp img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <div class="page-loading" id="page-loading">
    <div class="spinner"></div>
    <span>Loading profile…</span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>

  <script>
    let currentUser = null;
    let targetUid = null;
    let currentUserData = null;
    let isViewingSelf = true;

    requireAuth().then(async (user) => {
      currentUser = user;
      injectNav('profile');

      const urlParams = new URLSearchParams(window.location.search);
      targetUid = urlParams.get('uid') || user.uid;
      isViewingSelf = targetUid === user.uid;

      if (!isViewingSelf) {
        document.getElementById('signout-section').style.display = 'none';
      }

      // Real-time target user data
      db.collection('users').doc(targetUid).onSnapshot(async (snap) => {
        document.getElementById('page-loading').classList.add('hidden');
        if (snap.exists) {
          currentUserData = snap.data();
          renderProfile(currentUserData);
          renderEpicSection(currentUserData);
          await loadUserTeam(targetUid);
        } else {
          showToast('User profile not found', 'error');
        }
      }, (err) => {
        console.warn('User profile snapshot error:', err);
        document.getElementById('page-loading').classList.add('hidden');
      });

      // Transactions
      if (isViewingSelf) {
        try {
          const txs = await getUserTransactions(user.uid, 20);
          renderTransactions(txs);
        } catch (e) {
          renderTransactions([]);
        }
      } else {
        document.getElementById('tx-card').style.display = 'none';
      }

      // Match history
      subscribeUserMatches(targetUid, (matches) => {
        renderMatchHistory(matches.slice(0, 10));
      });
    }).catch(err => {
      console.error('Profile auth error:', err);
      document.getElementById('page-loading').classList.add('hidden');
    });

    function renderProfile(data) {
      const img  = document.getElementById('profile-avatar-img');
      const icon = document.getElementById('profile-avatar-icon');
      if (data.photoURL) {
        img.src = data.photoURL;
        img.style.display = 'block';
        icon.style.display = 'none';
      }

      document.getElementById('profile-name').textContent    = data.displayName || 'Champion';
      document.getElementById('profile-email').textContent   = data.email ? data.email : (data.discordUsername ? `@${data.discordUsername}` : '');
      document.getElementById('profile-tokens').textContent  = formatTokens(data.tokens ?? 10.00);
      document.getElementById('profile-earned').textContent  = formatTokens(data.totalEarned ?? 10.00);
      document.getElementById('profile-spent').textContent   = formatTokens(data.totalSpent ?? 0.00);
      document.getElementById('profile-played').textContent  = data.matchesPlayed ?? 0;
      document.getElementById('profile-won').textContent     = data.matchesWon ?? 0;

      const wr = data.matchesPlayed > 0
        ? Math.round((data.matchesWon / data.matchesPlayed) * 100) + '%'
        : '0%';
      document.getElementById('profile-winrate').textContent = wr;

      if (data.createdAt) {
        const d = data.createdAt.toDate();
        document.getElementById('profile-since').textContent =
          'Member since ' + d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
      }
    }

    // ── Epic Games / Fortnite Account Section ────────────────
    function renderEpicSection(data) {
      const el = document.getElementById('epic-content');
      if (!isViewingSelf) {
        if (data.epicUsername) {
          el.innerHTML = `
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="epic-tag-badge"><i data-lucide="gamepad-2"></i> ${data.epicUsername}</span>
              <span class="chip chip-success">Verified Player</span>
            </div>`;
        } else {
          el.innerHTML = `<span style="color:var(--text-muted);font-size:0.875rem;">No Epic Games account linked yet.</span>`;
        }
        lucide.createIcons();
        return;
      }

      if (data.epicUsername) {
        el.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="epic-tag-badge"><i data-lucide="gamepad-2"></i> ${data.epicUsername}</span>
              <span class="chip chip-success">Linked & Verified</span>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-outline btn-sm" onclick="openSyncEpicModal('${data.epicUsername}')">
                <i data-lucide="refresh-cw"></i> Sync / Change
              </button>
              <button class="btn btn-danger btn-sm" onclick="handleUnlinkEpic()">
                <i data-lucide="unlink"></i> Unlink (Fee: 2.00 Tokens)
              </button>
            </div>
          </div>`;
      } else {
        el.innerHTML = `
          <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:14px;">
            <strong style="color:var(--gold-bright);">Required to play:</strong> You must link your Epic Games / Fortnite username to create or join matches.
          </p>
          <form style="display:flex;gap:10px;max-width:440px;" onsubmit="handleLinkEpic(event)">
            <input class="form-input" id="epic-input" placeholder="Enter Epic Games / Fortnite Username…" required style="flex:1;" />
            <button type="submit" class="btn btn-primary btn-sm"><i data-lucide="link"></i> Link Account</button>
          </form>`;
      }
      lucide.createIcons();
    }

    async function handleLinkEpic(e) {
      e.preventDefault();
      const name = document.getElementById('epic-input').value.trim();
      try {
        await linkEpicAccount(currentUser.uid, name);
        showToast(`Epic Games account "${name}" linked successfully!`, 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function openSyncEpicModal(current) {
      const newName = prompt('Enter your updated Epic Games / Fortnite username to sync:', current);
      if (!newName || !newName.trim()) return;
      syncEpicAccount(currentUser.uid, newName.trim())
        .then(() => showToast(`Fortnite username synced to "${newName.trim()}"!`, 'success'))
        .catch(err => showToast(err.message, 'error'));
    }

    async function handleUnlinkEpic() {
      if (!confirm('Unlinking your Epic Games account costs 2.00 Tokens ($2.00). Are you sure you want to unlink?')) return;
      try {
        await unlinkEpicAccount(currentUser.uid);
        showToast('Epic Games account unlinked (-2.00 tokens fee deducted)', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ── Teams Section ────────────────────────────────────────
    async function loadUserTeam(uid) {
      const team = await getUserTeam(uid);
      renderTeamSection(team);
    }

    function renderTeamSection(team) {
      const el = document.getElementById('team-content');
      if (!team) {
        el.innerHTML = isViewingSelf ? `
          <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:16px;">
            Create or join a squad team to queue for <strong>2v2 Duos</strong> and <strong>3v3 Squads</strong> matches.
          </p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="openCreateTeamModal()">
              <i data-lucide="plus"></i> Create New Team
            </button>
            <button class="btn btn-outline btn-sm" onclick="openJoinTeamModal()">
              <i data-lucide="log-in"></i> Join with Invite Code
            </button>
          </div>` : `<span style="color:var(--text-muted);font-size:0.875rem;">Not currently on any squad team.</span>`;
      } else {
        const isOwner = team.ownerUid === currentUser?.uid;
        const membersHTML = (team.members || []).map(m => `
          <div class="team-member-chip">
            <div class="team-member-pfp">
              ${m.photoURL ? `<img src="${m.photoURL}" onerror="this.style.display='none'"/>` : m.displayName?.charAt(0)}
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                ${m.displayName}
              </div>
              <div style="font-size:0.7rem;color:var(--text-muted);">
                ${m.isLeader || m.uid === team.ownerUid ? '<span style="color:var(--gold-bright);">Leader</span>' : 'Member'}
              </div>
            </div>
          </div>
        `).join('');

        el.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge" style="background:var(--purple);color:#fff;font-size:0.8rem;padding:4px 10px;">[${team.tag}]</span>
              <span style="font-size:1.25rem;font-weight:900;color:#fff;">${team.name}</span>
            </div>
            ${isViewingSelf ? `
              <div style="display:flex;gap:8px;align-items:center;">
                <span class="match-code-badge" title="Team Invite Code" onclick="copyTeamCode('${team.code}')" style="cursor:pointer;">
                  <i data-lucide="hash"></i>${team.code} <span style="font-size:0.7rem;opacity:0.7;">(Copy)</span>
                </span>
                <button class="btn btn-danger btn-sm" onclick="handleLeaveTeam('${team.id}')">
                  <i data-lucide="log-out"></i> ${isOwner ? 'Disband Team' : 'Leave Team'}
                </button>
              </div>` : ''}
          </div>
          <div style="font-size:0.8rem;color:var(--text-muted);">Roster (${team.members?.length || 1}/6 Players):</div>
          <div class="team-roster-grid">${membersHTML}</div>`;
      }
      lucide.createIcons();
    }

    function copyTeamCode(code) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => showToast(`Team Code "${code}" copied to clipboard! Share it with teammates.`, 'info'));
      }
    }

    async function handleLeaveTeam(teamId) {
      if (!confirm('Are you sure you want to leave or disband this team?')) return;
      try {
        await leaveTeam(teamId, currentUser.uid);
        showToast('You left the team', 'success');
        await loadUserTeam(currentUser.uid);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function openCreateTeamModal() { document.getElementById('create-team-modal').classList.add('open'); }
    function closeCreateTeamModal() { document.getElementById('create-team-modal').classList.remove('open'); }
    function openJoinTeamModal() { document.getElementById('join-team-modal').classList.add('open'); }
    function closeJoinTeamModal() { document.getElementById('join-team-modal').classList.remove('open'); }

    async function submitCreateTeam(e) {
      e.preventDefault();
      const name = document.getElementById('team-name-input').value.trim();
      const tag  = document.getElementById('team-tag-input').value.trim().toUpperCase();
      const btn = document.getElementById('submit-team-btn');
      btn.disabled = true;
      try {
        await createTeam(currentUserData || currentUser, { name, tag });
        showToast(`Team "${name}" created!`, 'success');
        closeCreateTeamModal();
        await loadUserTeam(currentUser.uid);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function submitJoinTeam(e) {
      e.preventDefault();
      const code = document.getElementById('join-team-input').value.trim().toUpperCase();
      const btn = document.getElementById('submit-join-team-btn');
      btn.disabled = true;
      try {
        await joinTeamByCode(code, currentUserData || currentUser);
        showToast('Joined team successfully!', 'success');
        closeJoinTeamModal();
        await loadUserTeam(currentUser.uid);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderTransactions(txs) {
      const el = document.getElementById('tx-list');
      if (!txs.length) {
        el.innerHTML = `<div class="empty-state"><i data-lucide="inbox"></i><p>No transactions recorded yet</p></div>`;
        lucide.createIcons();
        return;
      }
      el.innerHTML = txs.map(tx => {
        const isCredit = tx.amount > 0;
        return `
          <div class="tx-item">
            <div class="tx-icon ${isCredit ? 'tx-icon--credit' : 'tx-icon--debit'}">
              <i data-lucide="${isCredit ? 'trending-up' : 'trending-down'}"></i>
            </div>
            <div class="tx-info">
              <div class="tx-desc">${tx.description || txTypeLabel(tx.type)}</div>
              <div class="tx-time">${formatTime(tx.timestamp)}</div>
            </div>
            <div class="tx-amount ${isCredit ? 'tx-amount--credit' : 'tx-amount--debit'}">
              ${isCredit ? '+' : ''}${formatTokens(tx.amount)} Tokens
            </div>
          </div>`;
      }).join('');
      lucide.createIcons();
    }

    function renderMatchHistory(matches) {
      const el = document.getElementById('match-history');
      if (!matches.length) {
        el.innerHTML = `<div class="empty-state"><i data-lucide="swords"></i><p>No matches played yet</p></div>`;
        lucide.createIcons();
        return;
      }
      el.innerHTML = matches.map(m => {
        const isWinner = m.winner?.uid === targetUid;
        const isHost   = m.createdBy === targetUid;
        const size     = m.size || '1v1';
        const mode     = m.mode || 'Realistic';
        const winPrize = Math.round(Number(m.prizePool || m.wager) * 0.90 * 100) / 100;

        const statusColor = {
          waiting:     'stat-icon--gold',
          in_progress: 'stat-icon--green',
          completed:   isWinner ? 'stat-icon--accent' : 'stat-icon--purple',
          cancelled:   'stat-icon--purple',
        }[m.status] || 'stat-icon--purple';
        const statusIcon = {
          waiting:     'clock',
          in_progress: 'play-circle',
          completed:   isWinner ? 'trophy' : 'x-circle',
          cancelled:   'slash',
        }[m.status] || 'circle';

        return `
          <div class="mh-card">
            <div class="mh-status-icon ${statusColor}">
              <i data-lucide="${statusIcon}"></i>
            </div>
            <div class="mh-info">
              <div class="mh-title">${m.title || `${size} ${mode}`}</div>
              <div class="mh-meta">
                <span class="badge ${sizeColor(size)}" style="padding:1px 8px;font-size:0.7rem;">${size}</span>
                <span class="badge ${modeColor(mode)}" style="padding:1px 8px;font-size:0.7rem;">${mode}</span>
                · ${formatTokens(m.wager)} wager
                · ${formatTime(m.createdAt)}
                ${isHost ? ' · <span style="color:var(--gold-bright);font-weight:700;">Host</span>' : ''}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
              ${m.status === 'completed'
                ? isWinner
                  ? `<div style="color:var(--green);font-weight:800;">+${formatTokens(winPrize)} Tokens</div><div style="font-size:0.75rem;color:var(--green);">Victory!</div>`
                  : `<div style="color:var(--red);font-weight:700;">-${formatTokens(m.wager)} Tokens</div><div style="font-size:0.75rem;color:var(--text-muted);">Defeat</div>`
                : `<span class="badge badge-${m.status}">${m.status.replace('_',' ')}</span>`
              }
            </div>
          </div>`;
      }).join('');
      lucide.createIcons();
    }
  </script>

  <main class="page-wrap">
    <!-- Profile hero -->
    <div class="profile-hero">
      <div class="profile-avatar">
        <img id="profile-avatar-img" src="" alt="" style="display:none"/>
        <i data-lucide="user" id="profile-avatar-icon"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div class="profile-name" id="profile-name">--</div>
        <div class="profile-email" id="profile-email"></div>
        <div class="profile-since" id="profile-since"></div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;font-weight:700;">Token Balance</div>
        <div style="font-size:1.9rem;font-weight:900;" class="stat-value--gold" id="profile-tokens">10.00</div>
      </div>
    </div>

    <!-- Epic Games / Fortnite Username Card -->
    <div class="epic-banner-card">
      <div class="section-title" style="margin-bottom:10px;color:#fff;">
        <i data-lucide="gamepad-2" style="color:#38bdf8;"></i> Epic Games / Fortnite Account
      </div>
      <div id="epic-content">
        <div class="spinner" style="margin:16px 0;"></div>
      </div>
    </div>

    <!-- Team Management Section (for 2v2 / 3v3) -->
    <div class="team-banner-card">
      <div class="section-title" style="margin-bottom:8px;color:#fff;">
        <i data-lucide="shield" style="color:var(--purple);"></i> Squad & Team Roster (2v2 / 3v3)
      </div>
      <div id="team-content">
        <div class="spinner" style="margin:16px 0;"></div>
      </div>
    </div>

    <!-- Stats grid -->
    <div class="grid-4" style="margin-bottom:28px;">
      <div class="card stat-card">
        <div class="stat-icon stat-icon--gold"><i data-lucide="trending-up"></i></div>
        <div class="stat-label">Total Earned</div>
        <div class="stat-value stat-value--gold" id="profile-earned">10.00</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon stat-icon--accent"><i data-lucide="trending-down"></i></div>
        <div class="stat-label">Total Spent</div>
        <div class="stat-value" id="profile-spent">0.00</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon stat-icon--purple"><i data-lucide="swords"></i></div>
        <div class="stat-label">Matches Played</div>
        <div class="stat-value" id="profile-played">0</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon stat-icon--green"><i data-lucide="trophy"></i></div>
        <div class="stat-label">Wins / Win Rate</div>
        <div class="stat-value">
          <span id="profile-won">0</span>
          <span style="font-size:0.9rem;color:var(--text-muted);"> / </span>
          <span id="profile-winrate" style="font-size:1.1rem;">0%</span>
        </div>
      </div>
    </div>

    <!-- Two-col: transactions + match history -->
    <div class="grid-2" style="align-items:start;gap:20px;">
      <div class="card" id="tx-card">
        <div class="section-title" style="margin-bottom:14px;">
          <i data-lucide="activity"></i> Transaction History
        </div>
        <div class="tx-list" id="tx-list">
          <div class="empty-state"><div class="spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-bottom:14px;">
          <i data-lucide="swords"></i> Match History
        </div>
        <div class="matches-history" id="match-history">
          <div class="empty-state"><div class="spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>
    </div>

    <!-- Sign out -->
    <div id="signout-section" style="margin-top:32px;text-align:center;">
      <button class="btn btn-danger" onclick="handleSignOut()">
        <i data-lucide="log-out"></i> Sign Out
      </button>
    </div>
  </main>

  <!-- Create Team Modal -->
  <div class="modal-overlay" id="create-team-modal" onclick="if(event.target===this)closeCreateTeamModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><i data-lucide="shield"></i> Create Squad Team</div>
        <button class="modal-close" onclick="closeCreateTeamModal()"><i data-lucide="x"></i></button>
      </div>
      <form class="modal-form" onsubmit="submitCreateTeam(event)">
        <div class="form-group">
          <label class="form-label">Team Name</label>
          <input class="form-input" id="team-name-input" placeholder="e.g. Apex Champions" maxlength="24" required />
        </div>
        <div class="form-group">
          <label class="form-label">Team Clan Tag (3-4 Letters)</label>
          <input class="form-input" id="team-tag-input" placeholder="e.g. APEX" maxlength="5" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeCreateTeamModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-team-btn">Create Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Join Team Modal -->
  <div class="modal-overlay" id="join-team-modal" onclick="if(event.target===this)closeJoinTeamModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><i data-lucide="log-in"></i> Join Team</div>
        <button class="modal-close" onclick="closeJoinTeamModal()"><i data-lucide="x"></i></button>
      </div>
      <form class="modal-form" onsubmit="submitJoinTeam(event)">
        <div class="form-group">
          <label class="form-label">Team Invite Code</label>
          <input class="form-input" id="join-team-input" placeholder="e.g. TM-AB123" required oninput="this.value=this.value.toUpperCase()" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeJoinTeamModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-join-team-btn">Join Team</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
