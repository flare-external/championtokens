<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile & Account — Champion Tokens</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    /* Clean, Professional Profile Layout */
    .profile-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 24px;
    }
    .profile-user-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .profile-pfp {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--bg-card-hover);
      border: 2px solid var(--gold-bright);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold-bright);
      box-shadow: 0 0 20px var(--gold-glow);
      flex-shrink: 0;
    }
    .profile-pfp img { width: 100%; height: 100%; object-fit: cover; }
    .discord-id-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(88, 101, 242, 0.12);
      border: 1px solid rgba(88, 101, 242, 0.3);
      color: #818cf8;
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-size: 0.78rem;
      font-family: monospace;
      margin-top: 4px;
    }

    /* Epic Games Account Box */
    .epic-account-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 24px;
    }
    .epic-badge-connected {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    /* Official Epic Games Vector Logo */
    .epic-official-svg {
      width: 22px;
      height: 25px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Team Card */
    .team-section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 24px;
    }
    .team-roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .team-member-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }

    .matches-history { display: flex; flex-direction: column; gap: 10px; }
    .mh-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <div class="page-loading" id="page-loading">
    <div class="spinner"></div>
    <span>Loading profile…</span>
  </div>

  <main class="page-wrap">
    <!-- Clean Profile Hero -->
    <div class="profile-hero-card">
      <div class="profile-user-group">
        <div class="profile-pfp">
          <img id="profile-avatar-img" src="" alt="" style="display:none"/>
          <i data-lucide="user" id="profile-avatar-icon"></i>
        </div>
        <div>
          <div style="font-size:1.6rem;font-weight:900;color:#fff;" id="profile-name">--</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;">
            <span style="font-weight:700;color:var(--text-muted);font-size:0.85rem;" id="profile-discord-tag">@discord</span>
            <span class="discord-id-pill" id="profile-discord-id">Discord ID: --</span>
          </div>
          <div style="font-size:0.75rem;color:var(--text-faint);margin-top:4px;" id="profile-since"></div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;font-weight:700;">Token Balance</div>
        <div style="font-size:2.2rem;font-weight:900;" class="stat-value--gold" id="profile-tokens">10.00</div>
      </div>
    </div>

    <!-- Epic Games Account Box -->
    <div class="epic-account-card">
      <div class="section-title" style="margin-bottom:12px;color:#fff;">
        <i data-lucide="gamepad-2" style="color:#38bdf8;"></i> Epic Games / Fortnite Account
      </div>
      <div id="epic-content">
        <div class="spinner" style="margin:12px 0;"></div>
      </div>
    </div>

    <!-- Squad Team Section -->
    <div class="team-section-card">
      <div class="section-title" style="margin-bottom:12px;color:#fff;">
        <i data-lucide="shield" style="color:var(--purple);"></i> Squad Team (2v2 / 3v3)
      </div>
      <div id="team-content">
        <div class="spinner" style="margin:12px 0;"></div>
      </div>
    </div>

    <!-- Stats grid -->
    <div class="grid-4" style="margin-bottom:24px;">
      <div class="card stat-card">
        <div class="stat-icon stat-icon--gold"><i data-lucide="trending-up"></i></div>
        <div class="stat-label">Total Earned</div>
        <div class="stat-value stat-value--gold" id="profile-earned">10.00</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon stat-icon--accent"><i data-lucide="trending-down"></i></div>
        <div class="stat-label">Total Spent</div>
        <div class="stat-value" id="profile-spent">0.00</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon stat-icon--purple"><i data-lucide="swords"></i></div>
        <div class="stat-label">Matches Played</div>
        <div class="stat-value" id="profile-played">0</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon stat-icon--green"><i data-lucide="trophy"></i></div>
        <div class="stat-label">Win Rate</div>
        <div class="stat-value" id="profile-winrate">0%</div>
      </div>
    </div>

    <!-- Transactions + Match History -->
    <div class="grid-2" style="align-items:start;gap:20px;">
      <div class="card" id="tx-card">
        <div class="section-title" style="margin-bottom:14px;">
          <i data-lucide="activity"></i> Transaction History
        </div>
        <div class="tx-list" id="tx-list">
          <div class="empty-state"><div class="spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-bottom:14px;">
          <i data-lucide="swords"></i> Match History
        </div>
        <div class="matches-history" id="match-history">
          <div class="empty-state"><div class="spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>
    </div>

    <div id="signout-section" style="margin-top:32px;text-align:center;">
      <button class="btn btn-danger btn-sm" onclick="handleSignOut()">
        <i data-lucide="log-out"></i> Sign Out
      </button>
    </div>
  </main>

  <!-- Create Team Modal -->
  <div class="modal-overlay" id="create-team-modal" onclick="if(event.target===this)closeCreateTeamModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><i data-lucide="shield"></i> Create Squad Team</div>
        <button class="modal-close" onclick="closeCreateTeamModal()"><i data-lucide="x"></i></button>
      </div>
      <form class="modal-form" onsubmit="submitCreateTeam(event)">
        <div class="form-group">
          <label class="form-label">Team Name</label>
          <input class="form-input" id="team-name-input" placeholder="e.g. Apex Champions" maxlength="24" required />
        </div>
        <div class="form-group">
          <label class="form-label">Team Clan Tag (3-4 Letters)</label>
          <input class="form-input" id="team-tag-input" placeholder="e.g. APEX" maxlength="5" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeCreateTeamModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-team-btn">Create Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Join Team Modal -->
  <div class="modal-overlay" id="join-team-modal" onclick="if(event.target===this)closeJoinTeamModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><i data-lucide="log-in"></i> Join Team</div>
        <button class="modal-close" onclick="closeJoinTeamModal()"><i data-lucide="x"></i></button>
      </div>
      <form class="modal-form" onsubmit="submitJoinTeam(event)">
        <div class="form-group">
          <label class="form-label">Team Invite Code</label>
          <input class="form-input" id="join-team-input" placeholder="e.g. TM-AB123" required oninput="this.value=this.value.toUpperCase()" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeJoinTeamModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-join-team-btn">Join Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Core Scripts (Placed after DOM elements) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>

  <script>
    let currentUser = null;
    let targetUid = null;
    let currentUserData = null;
    let isViewingSelf = true;

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth().then(async (user) => {
        currentUser = user;
        injectNav('profile');

        const urlParams = new URLSearchParams(window.location.search);
        targetUid = urlParams.get('uid') || user.uid;
        isViewingSelf = targetUid === user.uid;

        const signoutSec = document.getElementById('signout-section');
        if (signoutSec && !isViewingSelf) {
          signoutSec.style.display = 'none';
        }

        // Real-time target user data
        db.collection('users').doc(targetUid).onSnapshot(async (snap) => {
          const loadingEl = document.getElementById('page-loading');
          if (loadingEl) loadingEl.classList.add('hidden');

          if (snap.exists) {
            currentUserData = snap.data();
            renderProfile(currentUserData);
            renderEpicSection(currentUserData);
            try {
              await loadUserTeam(targetUid);
            } catch (e) {
              console.warn('loadUserTeam notice:', e);
              renderTeamSection(null);
            }
          } else {
            showToast('User profile not found', 'error');
            renderEpicSection({});
            renderTeamSection(null);
          }
        }, (err) => {
          console.warn('User profile snapshot error:', err);
          const loadingEl = document.getElementById('page-loading');
          if (loadingEl) loadingEl.classList.add('hidden');
          renderEpicSection({});
          renderTeamSection(null);
        });

        // Transactions
        if (isViewingSelf) {
          try {
            const txs = await getUserTransactions(user.uid, 20);
            renderTransactions(txs);
          } catch (e) {
            renderTransactions([]);
          }
        } else {
          const txCard = document.getElementById('tx-card');
          if (txCard) txCard.style.display = 'none';
        }

        // Match history
        subscribeUserMatches(targetUid, (matches) => {
          renderMatchHistory(matches.slice(0, 10));
        });
      }).catch(err => {
        console.error('Profile auth error:', err);
        const loadingEl = document.getElementById('page-loading');
        if (loadingEl) loadingEl.classList.add('hidden');
      });
    });

    function renderProfile(data) {
      if (!data) return;
      const img  = document.getElementById('profile-avatar-img');
      const icon = document.getElementById('profile-avatar-icon');
      if (img && icon && data.photoURL) {
        img.src = data.photoURL;
        img.style.display = 'block';
        icon.style.display = 'none';
      }

      const nameEl = document.getElementById('profile-name');
      if (nameEl) nameEl.textContent = data.displayName || 'Champion';

      const tagEl = document.getElementById('profile-discord-tag');
      const idEl  = document.getElementById('profile-discord-id');
      const discordId = data.discordId || (targetUid || '').replace('discord:', '');
      const discordHandle = data.discordUsername ? `@${data.discordUsername}` : (data.displayName || 'user');
      if (tagEl) tagEl.textContent = discordHandle;
      if (idEl) idEl.textContent = `Discord ID: ${discordId}`;

      const tokEl = document.getElementById('profile-tokens');
      const earnEl = document.getElementById('profile-earned');
      const spentEl = document.getElementById('profile-spent');
      const playedEl = document.getElementById('profile-played');
      const wonEl = document.getElementById('profile-won');
      const wrEl = document.getElementById('profile-winrate');

      if (tokEl) tokEl.textContent = formatTokens(data.tokens ?? 10.00);
      if (earnEl) earnEl.textContent = formatTokens(data.totalEarned ?? 10.00);
      if (spentEl) spentEl.textContent = formatTokens(data.totalSpent ?? 0.00);
      if (playedEl) playedEl.textContent = data.matchesPlayed ?? 0;
      if (wonEl) wonEl.textContent = data.matchesWon ?? 0;

      const wr = (data.matchesPlayed || 0) > 0
        ? Math.round(((data.matchesWon || 0) / data.matchesPlayed) * 100) + '%'
        : '0%';
      if (wrEl) wrEl.textContent = wr;

      const sinceEl = document.getElementById('profile-since');
      if (sinceEl && data.createdAt) {
        const d = data.createdAt.toDate();
        sinceEl.textContent =
          'Member since ' + d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
      }
      if (window.lucide) lucide.createIcons();
    }

    // ── Epic Games Account Section ────────────────────────────
    function renderEpicSection(data) {
      const el = document.getElementById('epic-content');
      if (!el) return;

      if (!isViewingSelf) {
        if (data && data.epicUsername) {
          el.innerHTML = `
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="epic-badge-connected">
                <img src="epic_games_logo.webp" alt="Epic Games" style="width:20px;height:24px;object-fit:contain;" />
                ${data.epicUsername}
              </span>
              <span class="chip chip-success">Verified Epic Account</span>
            </div>`;
        } else {
          el.innerHTML = `<span style="color:var(--text-muted);font-size:0.875rem;">No Epic Games account linked yet.</span>`;
        }
        if (window.lucide) lucide.createIcons();
        return;
      }

      if (data && data.epicUsername) {
        el.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="epic-badge-connected">
                <img src="epic_games_logo.webp" alt="Epic Games" style="width:20px;height:24px;object-fit:contain;" />
                ${data.epicUsername}
              </span>
              <span class="chip chip-success">Connected & Verified</span>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-outline btn-sm" onclick="signInWithEpic()">
                <i data-lucide="refresh-cw"></i> Re-Sync
              </button>
              <button class="btn btn-danger btn-sm" onclick="handleUnlinkEpic()">
                <i data-lucide="unlink"></i> Unlink (2.00 Tokens Fee)
              </button>
            </div>
          </div>`;
      } else {
        el.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
            <div>
              <div style="font-weight:700;color:#fff;font-size:0.95rem;">Connect Epic Games / Fortnite</div>
              <div style="font-size:0.8125rem;color:var(--text-muted);margin-top:2px;">
                Required to create and join matches. Verifies your official Fortnite display name.
              </div>
            </div>
            <button class="btn btn-epic" onclick="signInWithEpic()" style="display:inline-flex;align-items:center;gap:10px;padding:11px 22px;">
              <img src="epic_games_logo.webp" alt="Epic Games" style="width:22px;height:26px;object-fit:contain;" />
              Sign In with Epic Games
            </button>
          </div>`;
      }
      if (window.lucide) lucide.createIcons();
    }

    async function handleUnlinkEpic() {
      if (!confirm('Unlinking your Epic Games account costs 2.00 Tokens ($2.00). Are you sure you want to unlink?')) return;
      try {
        await unlinkEpicAccount(currentUser.uid);
        showToast('Epic Games account unlinked (-2.00 tokens fee deducted)', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ── Teams Section ────────────────────────────────────────
    async function loadUserTeam(uid) {
      try {
        const team = await getUserTeam(uid);
        renderTeamSection(team);
      } catch (e) {
        renderTeamSection(null);
      }
    }

    function renderTeamSection(team) {
      const el = document.getElementById('team-content');
      if (!el) return;

      if (!team) {
        el.innerHTML = isViewingSelf ? `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <div style="font-size:0.875rem;color:var(--text-muted);">
              Create or join a squad team to play <strong>2v2 Duos</strong> and <strong>3v3 Squads</strong> matches.
            </div>
            <div style="display:flex;gap:10px;">
              <button class="btn btn-primary btn-sm" onclick="openCreateTeamModal()"><i data-lucide="plus"></i> Create Team</button>
              <button class="btn btn-outline btn-sm" onclick="openJoinTeamModal()"><i data-lucide="log-in"></i> Join with Code</button>
            </div>
          </div>` : `<span style="color:var(--text-muted);font-size:0.875rem;">Not currently on any squad team.</span>`;
      } else {
        const isOwner = team.ownerUid === currentUser?.uid;
        const membersHTML = (team.members || []).map(m => `
          <div class="team-member-chip">
            <span style="font-weight:700;font-size:0.85rem;color:#fff;">${m.displayName}</span>
            ${m.isLeader || m.uid === team.ownerUid ? '<span class="badge" style="background:var(--gold-dim);color:var(--gold-bright);font-size:0.65rem;padding:1px 6px;">LEADER</span>' : ''}
          </div>
        `).join('');

        el.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge" style="background:var(--purple);color:#fff;font-size:0.8rem;padding:4px 10px;">[${team.tag}]</span>
              <span style="font-size:1.15rem;font-weight:900;color:#fff;">${team.name}</span>
            </div>
            ${isViewingSelf ? `
              <div style="display:flex;gap:8px;align-items:center;">
                <span class="match-code-badge" title="Team Invite Code" onclick="copyTeamCode('${team.code}')" style="cursor:pointer;">
                  <i data-lucide="hash"></i>${team.code} <span style="font-size:0.7rem;opacity:0.7;">(Copy)</span>
                </span>
                <button class="btn btn-danger btn-sm" onclick="handleLeaveTeam('${team.id}')">
                  <i data-lucide="log-out"></i> ${isOwner ? 'Disband' : 'Leave'}
                </button>
              </div>` : ''}
          </div>
          <div style="font-size:0.8rem;color:var(--text-muted);">Roster (${team.members?.length || 1}/6 Players):</div>
          <div class="team-roster-grid">${membersHTML}</div>`;
      }
      if (window.lucide) lucide.createIcons();
    }

    function copyTeamCode(code) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => showToast(`Team Code "${code}" copied to clipboard! Share it with teammates.`, 'info'));
      }
    }

    async function handleLeaveTeam(teamId) {
      if (!confirm('Are you sure you want to leave or disband this team?')) return;
      try {
        await leaveTeam(teamId, currentUser.uid);
        showToast('You left the team', 'success');
        await loadUserTeam(currentUser.uid);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function openCreateTeamModal() { document.getElementById('create-team-modal').classList.add('open'); }
    function closeCreateTeamModal() { document.getElementById('create-team-modal').classList.remove('open'); }
    function openJoinTeamModal() { document.getElementById('join-team-modal').classList.add('open'); }
    function closeJoinTeamModal() { document.getElementById('join-team-modal').classList.remove('open'); }

    async function submitCreateTeam(e) {
      e.preventDefault();
      const name = document.getElementById('team-name-input').value.trim();
      const tag  = document.getElementById('team-tag-input').value.trim().toUpperCase();
      const btn = document.getElementById('submit-team-btn');
      btn.disabled = true;
      try {
        await createTeam(currentUserData || currentUser, { name, tag });
        showToast(`Team "${name}" created!`, 'success');
        closeCreateTeamModal();
        await loadUserTeam(currentUser.uid);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function submitJoinTeam(e) {
      e.preventDefault();
      const code = document.getElementById('join-team-input').value.trim().toUpperCase();
      const btn = document.getElementById('submit-join-team-btn');
      btn.disabled = true;
      try {
        await joinTeamByCode(code, currentUserData || currentUser);
        showToast('Joined team successfully!', 'success');
        closeJoinTeamModal();
        await loadUserTeam(currentUser.uid);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderTransactions(txs) {
      const el = document.getElementById('tx-list');
      if (!el) return;
      if (!txs.length) {
        el.innerHTML = `<div class="empty-state"><i data-lucide="inbox"></i><p>No transactions recorded yet</p></div>`;
        if (window.lucide) lucide.createIcons();
        return;
      }
      el.innerHTML = txs.map(tx => {
        const isCredit = tx.amount > 0;
        return `
          <div class="tx-item">
            <div class="tx-icon ${isCredit ? 'tx-icon--credit' : 'tx-icon--debit'}">
              <i data-lucide="${isCredit ? 'trending-up' : 'trending-down'}"></i>
            </div>
            <div class="tx-info">
              <div class="tx-desc">${tx.description || txTypeLabel(tx.type)}</div>
              <div class="tx-time">${formatTime(tx.timestamp)}</div>
            </div>
            <div class="tx-amount ${isCredit ? 'tx-amount--credit' : 'tx-amount--debit'}">
              ${isCredit ? '+' : ''}${formatTokens(tx.amount)} Tokens
            </div>
          </div>`;
      }).join('');
      if (window.lucide) lucide.createIcons();
    }

    function renderMatchHistory(matches) {
      const el = document.getElementById('match-history');
      if (!el) return;
      if (!matches.length) {
        el.innerHTML = `<div class="empty-state"><i data-lucide="swords"></i><p>No matches played yet</p></div>`;
        if (window.lucide) lucide.createIcons();
        return;
      }
      el.innerHTML = matches.map(m => {
        const isWinner = m.winner?.uid === targetUid;
        const isHost   = m.createdBy === targetUid;
        const size     = m.size || '1v1';
        const mode     = m.mode || 'Realistic';
        const winPrize = Math.round(Number(m.prizePool || m.wager) * 0.90 * 100) / 100;

        return `
          <div class="mh-card">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:0.95rem;">${m.title || `${size} ${mode}`}</div>
              <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">
                <span class="badge ${sizeColor(size)}" style="padding:1px 8px;font-size:0.7rem;">${size}</span>
                <span class="badge ${modeColor(mode)}" style="padding:1px 8px;font-size:0.7rem;">${mode}</span>
                · ${formatTokens(m.wager)} wager · ${formatTime(m.createdAt)}
                ${isHost ? ' · <span style="color:var(--gold-bright);font-weight:700;">Host</span>' : ''}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
              ${m.status === 'completed'
                ? isWinner
                  ? `<div style="color:var(--green);font-weight:800;">+${formatTokens(winPrize)} Tokens</div><div style="font-size:0.75rem;color:var(--green);">Victory!</div>`
                  : `<div style="color:var(--red);font-weight:700;">-${formatTokens(m.wager)} Tokens</div><div style="font-size:0.75rem;color:var(--text-muted);">Defeat</div>`
                : `<span class="badge badge-${m.status}">${m.status.replace('_',' ')}</span>`
              }
            </div>
          </div>`;
      }).join('');
      if (window.lucide) lucide.createIcons();
    }
  </script>
</body>
</html>
