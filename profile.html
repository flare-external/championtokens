<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contender Profile — Champion Tokens</title>
  <link rel="icon" type="image/png" href="/champion-tokens_new.png"/>
  <link rel="stylesheet" href="/css/style.css?v=5.5"/>
  <link rel="stylesheet" href="/css/ranked.css?v=4.5"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="/js/protect.js"></script>
  <style>
    .pf-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 80px;
      position: relative;
      z-index: 10;
    }

    /* Clean Profile Banner Card */
    .pf-banner-card {
      background: #08090c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Banner Backdrop Image (Smaller & Customizable) */
    .pf-banner-cover {
      height: 135px;
      background: linear-gradient(135deg, #090c10 0%, #151a23 50%, #0d1117 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background-image 0.3s ease;
    }

    .pf-banner-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(83, 252, 24, 0.12), transparent 70%);
      pointer-events: none;
    }

    /* Edit Banner Button */
    .pf-edit-banner-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 20;
    }

    .pf-edit-banner-btn:hover {
      background: rgba(83, 252, 24, 0.15);
      border-color: #53fc18;
      color: #53fc18;
    }

    /* Banner Body */
    .pf-banner-body {
      padding: 0 28px 28px;
      position: relative;
    }

    .pf-profile-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: -46px;
    }

    .pf-user-left {
      display: flex;
      align-items: flex-end;
      gap: 20px;
    }

    /* PFP with Kick Neon Border */
    .pf-avatar-wrap {
      position: relative;
    }

    .pf-avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      border: 3.5px solid #53fc18;
      box-shadow: 0 0 25px rgba(83, 252, 24, 0.35);
      display: block;
    }

    .pf-user-meta {
      padding-bottom: 4px;
    }

    .pf-username {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      display: inline-block;
    }

    .pf-id-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .pf-copy-btn {
      background: transparent;
      border: none;
      color: #53fc18;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    .pf-copy-btn:hover {
      background: rgba(83, 252, 24, 0.1);
    }

    /* Edit Banner Modal Styling */
    .ct-banner-modal-card {
      background: #0b0d12;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .ct-mod-alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      margin-top: 12px;
      line-height: 1.4;
      display: none;
    }

    .ct-mod-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .ct-mod-alert.success {
      display: block;
      background: rgba(83, 252, 24, 0.12);
      border: 1px solid rgba(83, 252, 24, 0.35);
      color: #53fc18;
    }
  </style>
</head>
<body data-ct-page="profile" style="background:#000000;color:#ffffff;margin:0;font-family:'Inter',sans-serif;">

  <!-- Main Profile Container -->
  <main class="pf-container">

    <!-- Profile Banner & Identity Card -->
    <section class="pf-banner-card">
      
      <!-- Backdrop Banner Cover with Edit Button -->
      <div class="pf-banner-cover" id="pf-banner-cover">
        <button type="button" class="pf-edit-banner-btn" id="btn-edit-banner" title="Change your profile banner">
          <i data-lucide="camera" style="width:14px;height:14px;"></i>
          <span>Edit Banner</span>
        </button>
      </div>

      <!-- Banner Body: Avatar, Name + Badges, Contender ID, Compact HUD -->
      <div class="pf-banner-body">
        <div class="pf-profile-flex">
          
          <!-- Left: PFP, Username with Badges Box, 12-Digit Contender ID -->
          <div class="pf-user-left">
            <div class="pf-avatar-wrap">
              <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=120&auto=format&fit=crop&q=80" id="pf-avatar" class="pf-avatar-img" alt="Contender Avatar"/>
            </div>

            <div class="pf-user-meta">
              <!-- Username Row with Badges Box -->
              <div class="pf-username-row">
                <span class="pf-username" id="pf-display-name">adrian</span>
                
                <!-- Badges Box -->
                <div class="pf-badges-box" id="pf-badges-box">
                  <div class="pf-badge pf-badge-beta" data-badge-tooltip="Given away to early beta testers of the site.">
                    <i data-lucide="sparkles" style="width:12px;height:12px;"></i>
                    <span>Beta Tester</span>
                  </div>
                </div>
              </div>

              <!-- Contender ID Row -->
              <div class="pf-id-row">
                <span>Contender ID: <strong style="color:#ffffff;" id="pf-contender-id">112118831941</strong></span>
                <button type="button" class="pf-copy-btn" id="btn-copy-id" title="Copy Contender ID">
                  <i data-lucide="copy" style="width:14px;height:14px;"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Right: Compact Gaming HUD Box (Rank | Place | ELO with Line Cuts & Top 50 Animated Gold) -->
          <div class="pf-hud-card" id="pf-hud-card">
            
            <!-- Rank Column -->
            <div class="pf-hud-col">
              <div class="pf-hud-val">
                <img src="/medal-ranks/svg/10-star.svg" id="pf-hud-icon" class="pf-hud-icon" alt="Rank"/>
                <span id="pf-hud-rank">Unreal</span>
              </div>
              <div class="pf-hud-label-line">
                <span>RANK</span>
              </div>
            </div>

            <!-- Vertical Divider -->
            <div class="pf-hud-divider"></div>

            <!-- Place Column -->
            <div class="pf-hud-col">
              <div class="pf-hud-val" id="pf-hud-place">#1</div>
              <div class="pf-hud-label-line">
                <span>PLACE</span>
              </div>
            </div>

            <!-- Vertical Divider -->
            <div class="pf-hud-divider"></div>

            <!-- ELO Column -->
            <div class="pf-hud-col">
              <div class="pf-hud-val" id="pf-hud-elo">9,999</div>
              <div class="pf-hud-label-line">
                <span>ELO</span>
              </div>
            </div>

          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- Edit Banner Modal with Automated Moderation -->
  <div class="ct-modal-overlay" id="banner-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:9999;align-items:center;justify-content:center;">
    <div class="ct-banner-modal-card">
      <button type="button" class="ct-modal-close-btn" id="btn-close-banner-modal" style="position:absolute;top:16px;right:16px;background:transparent;border:none;color:#94a3b8;cursor:pointer;">
        <i data-lucide="x" style="width:20px;height:20px;"></i>
      </button>

      <div style="font-family:'Outfit',sans-serif;font-size:1.25rem;font-weight:700;margin-bottom:6px;">
        Set Profile Banner
      </div>
      <div style="font-size:0.8rem;color:#94a3b8;margin-bottom:18px;">
        Upload an image or paste a direct image URL. All banners pass automated AI safety moderation.
      </div>

      <!-- Option 1: File Upload -->
      <label style="display:block;font-size:0.75rem;font-weight:600;color:#64748b;margin-bottom:6px;text-transform:uppercase;">
        Upload Image File
      </label>
      <input type="file" id="input-banner-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />
      <button type="button" id="btn-trigger-upload" style="width:100%;padding:10px;background:#14171e;border:1px dashed rgba(255,255,255,0.2);color:#94a3b8;border-radius:10px;font-size:0.82rem;font-weight:600;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <i data-lucide="upload" style="width:15px;height:15px;color:#53fc18;"></i>
        <span id="label-upload-status">Choose file from device...</span>
      </button>

      <!-- Option 2: Image URL -->
      <label style="display:block;font-size:0.75rem;font-weight:600;color:#64748b;margin-bottom:6px;text-transform:uppercase;">
        Or Image URL
      </label>
      <input type="url" id="input-banner-url" placeholder="https://example.com/banner.png" style="width:100%;box-sizing:border-box;background:#000;border:1px solid rgba(255,255,255,0.12);color:#fff;padding:10px 14px;border-radius:10px;font-size:0.85rem;outline:none;margin-bottom:12px;" />

      <!-- Moderation Status Message -->
      <div class="ct-mod-alert" id="banner-mod-alert"></div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button type="button" id="btn-cancel-banner" style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#94a3b8;padding:8px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;">
          Cancel
        </button>
        <button type="button" id="btn-save-banner" style="background:#53fc18;border:none;color:#000;padding:8px 20px;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer;">
          Apply Banner
        </button>
      </div>
    </div>
  </div>

  <!-- Universal Pinned Bottom Bar -->
  <footer class="ct-footer">
    <div style="font-size:0.75rem;color:#475569;">
      © 2026 Champion Tokens • Protected by Cloudflare
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/ranked-nav.js"></script>
  <script>
    function getRankMeta(elo, isUnranked) {
      if (isUnranked || elo <= 0) {
        return { name: 'Unranked', icon: '/medal-ranks/svg/01-bronze.svg', eloDisplay: '0', place: '--', numPlace: 999 };
      }
      if (elo < 500) return { name: 'Bronze', icon: '/medal-ranks/svg/01-bronze.svg', eloDisplay: elo.toLocaleString(), place: '#2,180', numPlace: 2180 };
      if (elo < 1000) return { name: 'Silver', icon: '/medal-ranks/svg/02-silver.svg', eloDisplay: elo.toLocaleString(), place: '#1,040', numPlace: 1040 };
      if (elo < 1500) return { name: 'Gold', icon: '/medal-ranks/svg/03-gold.svg', eloDisplay: elo.toLocaleString(), place: '#612', numPlace: 612 };
      if (elo < 2000) return { name: 'Platinum', icon: '/medal-ranks/svg/04-platinum.svg', eloDisplay: elo.toLocaleString(), place: '#285', numPlace: 285 };
      if (elo < 2400) return { name: 'Diamond', icon: '/medal-ranks/svg/05-diamond.svg', eloDisplay: elo.toLocaleString(), place: '#118', numPlace: 118 };
      if (elo < 2700) return { name: 'Elite', icon: '/medal-ranks/svg/06-elite.svg', eloDisplay: elo.toLocaleString(), place: '#42', numPlace: 42 };
      if (elo < 3000) return { name: 'Champion', icon: '/medal-ranks/svg/07-champion.svg', eloDisplay: elo.toLocaleString(), place: '#14', numPlace: 14 };
      return { name: 'Unreal', icon: '/medal-ranks/svg/10-star.svg', eloDisplay: elo.toLocaleString(), place: '#1', numPlace: 1 };
    }

    function sanitizeTo12Digits(val) {
      if (!val) return null;
      const digits = String(val).replace(/\D/g, '');
      if (digits.length >= 12) return digits.slice(0, 12);
      return null;
    }

    // Automated Moderation Engine
    async function inspectImageSafety(imgSrc, rawName = '') {
      // 1. Text keyword inspection
      const forbiddenKeywords = [
        'gore', 'blood', 'wound', 'death', 'murder', 'kill', 'suicide', 'corpse',
        'porn', 'nsfw', 'hentai', 'sex', 'xxx', 'nude', 'naked', 'penis', 'boobs',
        'vagina', 'swastika', 'nazi', 'beheading', 'violence', 'erotic'
      ];

      const combinedText = (rawName + ' ' + imgSrc).toLowerCase();
      for (const word of forbiddenKeywords) {
        if (combinedText.includes(word)) {
          return { safe: false, reason: `Safety Filter: Prohibited keyword "${word}" detected.` };
        }
      }

      // 2. Client-side canvas pixel inspection
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 100;
            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(img, 0, 0, size, size);
            const imageData = ctx.getImageData(0, 0, size, size);
            const data = imageData.data;

            let skinPixels = 0;
            let bloodPixels = 0;
            const totalPixels = size * size;

            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];

              // Skin-tone heuristic
              if (r > 95 && g > 40 && b > 20 && (Math.max(r, g, b) - Math.min(r, g, b) > 15) && Math.abs(r - g) > 15 && r > g && r > b) {
                skinPixels++;
              }

              // Deep saturated red (blood / gore heuristic)
              if (r > 150 && g < 50 && b < 50) {
                bloodPixels++;
              }
            }

            const skinRatio = skinPixels / totalPixels;
            const bloodRatio = bloodPixels / totalPixels;

            if (skinRatio > 0.42) {
              return resolve({ safe: false, reason: 'Automated Moderation: Image rejected for containing excessive skin exposure or suggestive content.' });
            }

            if (bloodRatio > 0.22) {
              return resolve({ safe: false, reason: 'Automated Moderation: Image rejected for containing high concentration of graphic or violent red content.' });
            }

            resolve({ safe: true });
          } catch (e) {
            // If crossOrigin blocks pixel reading, allow if text passed
            resolve({ safe: true });
          }
        };

        img.onerror = () => {
          resolve({ safe: false, reason: 'Failed to load image. Please check the URL or file format.' });
        };

        img.src = imgSrc;
      });
    }

    function initProfile() {
      // 1. Resolve 12-digit Contender ID (Never discord:...)
      let contenderId = sanitizeTo12Digits(window.location.pathname);
      if (!contenderId) {
        contenderId = sanitizeTo12Digits(localStorage.getItem('ct_contender_id'));
      }

      let user = {
        id: contenderId || '112118831941',
        name: 'adrian',
        customName: '',
        tag: '',
        avatar: 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=120&auto=format&fit=crop&q=80'
      };

      const cached = localStorage.getItem('ct_user');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          user = Object.assign(user, parsed);
          const sanitizedId = sanitizeTo12Digits(user.id || user.uid);
          if (sanitizedId) user.id = sanitizedId;
        } catch (e) {}
      }

      if (!/^\d{12}$/.test(user.id)) {
        user.id = sanitizeTo12Digits(user.id) || Math.floor(100000000000 + Math.random() * 900000000000).toString();
      }
      localStorage.setItem('ct_contender_id', user.id);

      // 2. Custom Banner Loading
      const savedBanner = localStorage.getItem('ct_user_banner');
      const bannerCoverEl = document.getElementById('pf-banner-cover');
      if (savedBanner && bannerCoverEl) {
        bannerCoverEl.style.backgroundImage = `url('${savedBanner}')`;
      }

      // 3. ELO & Rank Data
      const savedElo = localStorage.getItem('ct_user_elo');
      const isUnranked = localStorage.getItem('ct_is_unranked') === 'true';
      const elo = savedElo !== null ? parseInt(savedElo, 10) : 9999;
      const meta = getRankMeta(elo, isUnranked);

      const displayName = user.customName || user.displayName || user.name || 'adrian';
      const nameEl = document.getElementById('pf-display-name');
      const idEl = document.getElementById('pf-contender-id');
      const avatarEl = document.getElementById('pf-avatar');

      if (nameEl) nameEl.textContent = displayName;
      if (idEl) idEl.textContent = user.id;
      if (avatarEl && user.avatar) avatarEl.src = user.avatar;

      // 4. Compact HUD Values
      const hudRankEl = document.getElementById('pf-hud-rank');
      const hudIconEl = document.getElementById('pf-hud-icon');
      const hudPlaceEl = document.getElementById('pf-hud-place');
      const hudEloEl = document.getElementById('pf-hud-elo');
      const hudCardEl = document.getElementById('pf-hud-card');

      if (hudRankEl) hudRankEl.textContent = meta.name;
      if (hudIconEl) hudIconEl.src = meta.icon;
      if (hudPlaceEl) hudPlaceEl.textContent = meta.place;
      if (hudEloEl) hudEloEl.textContent = meta.eloDisplay;

      // Top 50 Animated Gold Effect
      if (hudCardEl) {
        if (meta.numPlace <= 50) {
          hudCardEl.classList.add('top-50');
        } else {
          hudCardEl.classList.remove('top-50');
        }
      }

      // 5. Copy ID Handler
      document.getElementById('btn-copy-id')?.addEventListener('click', () => {
        navigator.clipboard.writeText(user.id).then(() => {
          showToast('Contender ID copied to clipboard!');
        });
      });

      // 6. Edit Banner Handlers & Moderation Flow
      const bannerModal = document.getElementById('banner-modal');
      const openBannerBtn = document.getElementById('btn-edit-banner');
      const closeBannerBtn = document.getElementById('btn-close-banner-modal');
      const cancelBannerBtn = document.getElementById('btn-cancel-banner');
      const saveBannerBtn = document.getElementById('btn-save-banner');
      const fileInput = document.getElementById('input-banner-file');
      const triggerUploadBtn = document.getElementById('btn-trigger-upload');
      const urlInput = document.getElementById('input-banner-url');
      const modAlert = document.getElementById('banner-mod-alert');
      const uploadStatusLabel = document.getElementById('label-upload-status');

      let pendingBannerData = null;
      let pendingBannerName = '';

      function openModal() {
        if (!bannerModal) return;
        bannerModal.style.display = 'flex';
        modAlert.className = 'ct-mod-alert';
        modAlert.textContent = '';
      }

      function closeModal() {
        if (!bannerModal) return;
        bannerModal.style.display = 'none';
        pendingBannerData = null;
        pendingBannerName = '';
        if (fileInput) fileInput.value = '';
        if (urlInput) urlInput.value = '';
        if (uploadStatusLabel) uploadStatusLabel.textContent = 'Choose file from device...';
      }

      if (openBannerBtn) openBannerBtn.addEventListener('click', openModal);
      if (closeBannerBtn) closeBannerBtn.addEventListener('click', closeModal);
      if (cancelBannerBtn) cancelBannerBtn.addEventListener('click', closeModal);

      if (triggerUploadBtn && fileInput) {
        triggerUploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          pendingBannerName = file.name;
          if (uploadStatusLabel) uploadStatusLabel.textContent = file.name;
          const reader = new FileReader();
          reader.onload = (re) => {
            pendingBannerData = re.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      if (saveBannerBtn) {
        saveBannerBtn.addEventListener('click', async () => {
          const rawUrl = urlInput.value.trim();
          const targetImage = pendingBannerData || rawUrl;
          const targetName = pendingBannerName || rawUrl;

          if (!targetImage) {
            modAlert.className = 'ct-mod-alert error';
            modAlert.textContent = 'Please choose a file or enter an image URL.';
            return;
          }

          modAlert.className = 'ct-mod-alert';
          modAlert.style.display = 'block';
          modAlert.style.background = 'rgba(255,255,255,0.06)';
          modAlert.style.color = '#94a3b8';
          modAlert.textContent = 'Scanning image with automated safety moderation...';

          const modResult = await inspectImageSafety(targetImage, targetName);

          if (!modResult.safe) {
            modAlert.className = 'ct-mod-alert error';
            modAlert.textContent = modResult.reason;
            return;
          }

          // Approved! Save and apply
          modAlert.className = 'ct-mod-alert success';
          modAlert.textContent = '✓ Passed automated safety moderation! Applying banner...';

          setTimeout(() => {
            localStorage.setItem('ct_user_banner', targetImage);
            if (bannerCoverEl) {
              bannerCoverEl.style.backgroundImage = `url('${targetImage}')`;
            }
            closeModal();
            showToast('Profile banner updated successfully!');
          }, 600);
        });
      }

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', initProfile);

    function showToast(msg) {
      let toast = document.getElementById('pf-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'pf-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }
  </script>
</body>
</html>
