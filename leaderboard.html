<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <meta name="title" content="Champion Tokens Leaderboard"/>
  <meta name="description" content="View top ranked Fortnite players, biggest token earners, win streaks, and champion podium standings on Champion Tokens!"/>
  <meta name="theme-color" content="#F59E0B"/>

  <link rel="icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="shortcut icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="apple-touch-icon" href="champion-tokens_new.png"/>
  <link rel="stylesheet" href="css/style.css?v=4.0.1788135215812"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    /* ── Dark Glass Leaderboard Aesthetics ── */
    @keyframes spinRefresh {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spinning-icon {
      animation: spinRefresh 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
    }

    /* 1. Morphed Header & Stats Card */
    .lb-morphed-header-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.85);
    }

    .lb-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin: 0;
    }

    .lb-stat-card {
      background: #060608;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }
    .lb-stat-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .lb-stat-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 2. Podium Showcase */
    .podium-section {
      display: grid;
      grid-template-columns: 1fr 1.08fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
      align-items: end;
    }

    .podium-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.85);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .podium-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .podium-card--1 {
      border-color: rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.08) 0%, #000000 100%);
      padding-top: 30px;
      padding-bottom: 26px;
    }
    .podium-card--2 {
      border-color: rgba(203, 213, 225, 0.16);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, #000000 100%);
    }
    .podium-card--3 {
      border-color: rgba(217, 119, 6, 0.18);
      background: linear-gradient(180deg, rgba(217, 119, 6, 0.04) 0%, #000000 100%);
    }

    .podium-avatar-wrap {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .podium-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .podium-avatar-wrap--1 { width: 80px; height: 80px; border: none; box-shadow: none; }
    .podium-avatar-wrap--2 { border: none; box-shadow: none; }
    .podium-avatar-wrap--3 { border: none; box-shadow: none; }

    /* Rank Pills */
    .rank-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .rank-pill.rank-1 {
      background: rgba(245, 158, 11, 0.22);
      color: var(--gold-bright);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .rank-pill.rank-2 {
      background: rgba(203, 213, 225, 0.16);
      color: #e2e8f0;
      border: 1px solid rgba(203, 213, 225, 0.3);
    }
    .rank-pill.rank-3 {
      background: rgba(217, 119, 6, 0.18);
      color: #f59e0b;
      border: 1px solid rgba(217, 119, 6, 0.3);
    }
    .rank-pill.rank-other {
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: monospace;
      font-size: 0.8rem;
    }

    /* 3. Table Container & Height-Elevated Search Bar */
    .lb-table-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px 26px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.85);
      margin-bottom: 32px;
    }

    .lb-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 22px;
    }

    .lb-search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .lb-search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #64748b;
      pointer-events: none;
    }

    .lb-search-input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 44px;
      background: #060608;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 0.88rem;
      color: #ffffff;
      transition: border-color 0.18s ease;
    }
    .lb-search-input:focus {
      border-color: rgba(255, 255, 255, 0.22);
      outline: none;
    }

    .lb-sort-tabs-wrap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lb-sort-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: #060608;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .lb-sort-tab:hover {
      background: #101014;
      color: #fff;
    }
    .lb-sort-tab.active {
      background: #18181b;
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-weight: 800;
    }
    .lb-sort-tab.active i {
      color: var(--gold-bright);
    }

    .lb-custom-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      min-width: 600px;
    }
    .lb-custom-table th {
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 16px;
      border: none;
      text-align: left;
    }
    .lb-custom-table tbody tr {
      background: #060608;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .lb-custom-table tbody tr:hover {
      background: #0e0e12;
      transform: translateY(-1px);
    }
    .lb-custom-table tbody tr.current-user {
      background: rgba(245, 158, 11, 0.07);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .lb-custom-table td {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .lb-custom-table td:first-child {
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }
    .lb-custom-table td:last-child {
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    @media (max-width: 768px) {
      .podium-section { grid-template-columns: 1fr; }
      .podium-card--1 { order: -1; }
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <div class="page-loading" id="page-loading">
    <div class="spinner"></div>
    <span>Loading leaderboard…</span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js?v=3.8"></script>
  <script src="js/auth.js?v=4.0.1788135215812"></script>
  <script src="js/db.js?v=4.0.1788135215812"></script>
  <script src="js/nav.js?v=4.0.1788135215812"></script>

  <script>
    let currentUser = null;
    let allLeaderboardUsers = [];
    let filteredUsers = [];
    let lbSearchQuery = '';
    let currentSortMode = 'wins'; // 'wins' | 'earnings' | 'winrate'
    let lbCurrentPage = 1;
    const LB_PER_PAGE = 10;

    requireAuth().then(async (user) => {
      currentUser = user;
      injectNav('leaderboard');
      await loadLeaderboard();
      document.getElementById('page-loading').classList.add('hidden');
    });

    async function loadLeaderboard() {
      try {
        allLeaderboardUsers = await getLeaderboard();
        updateOverviewStats(allLeaderboardUsers);
        applySortAndFilter();
      } catch (err) {
        console.error('Leaderboard error:', err);
        showToast('Failed to load leaderboard', 'error');
      }
    }

    function updateOverviewStats(users) {
      const totalCompetitors = users.length;
      let totalWins = 0;
      let totalEarned = 0;
      let highestWr = 0;

      users.forEach(u => {
        const w = Number(u.matchesWon || 0);
        const p = Number(u.matchesPlayed || 0);
        const e = Number(u.totalEarned || 0);
        totalWins += w;
        totalEarned += e;
        if (p >= 3) {
          const wr = Math.round((w / p) * 100);
          if (wr > highestWr) highestWr = wr;
        }
      });

      document.getElementById('stat-total-players').textContent = totalCompetitors;
      document.getElementById('stat-total-wins').textContent = totalWins;
      document.getElementById('stat-total-earned').textContent = formatTokens(totalEarned);
      document.getElementById('stat-top-winrate').textContent = (highestWr > 0 ? highestWr + '%' : '100%');
    }

    function setSortMode(mode) {
      currentSortMode = mode;
      document.querySelectorAll('.lb-sort-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.sort === mode);
      });
      applySortAndFilter();
    }

    function handleSearchLeaderboard(val) {
      lbSearchQuery = (val || '').toLowerCase().trim();
      applySortAndFilter();
    }

    function applySortAndFilter() {
      let list = [...allLeaderboardUsers];

      // Apply Search
      if (lbSearchQuery) {
        list = list.filter(u => {
          const name = (u.displayName || '').toLowerCase();
          const epic = (u.epicUsername || '').toLowerCase();
          const disc = (u.discordUsername || '').toLowerCase();
          return name.includes(lbSearchQuery) || epic.includes(lbSearchQuery) || disc.includes(lbSearchQuery);
        });
      }

      // Apply Sort
      if (currentSortMode === 'earnings') {
        list.sort((a, b) => (Number(b.totalEarned) || 0) - (Number(a.totalEarned) || 0) || (Number(b.matchesWon) || 0) - (Number(a.matchesWon) || 0));
      } else if (currentSortMode === 'winrate') {
        list.sort((a, b) => {
          const wrA = (Number(a.matchesPlayed) || 0) > 0 ? ((Number(a.matchesWon) || 0) / Number(a.matchesPlayed)) : 0;
          const wrB = (Number(b.matchesPlayed) || 0) > 0 ? ((Number(b.matchesWon) || 0) / Number(b.matchesPlayed)) : 0;
          return wrB - wrA || (Number(b.matchesWon) || 0) - (Number(a.matchesWon) || 0);
        });
      } else {
        // Default: Wins
        list.sort((a, b) => (Number(b.matchesWon) || 0) - (Number(a.matchesWon) || 0) || (Number(b.totalEarned) || 0) - (Number(a.totalEarned) || 0));
      }

      filteredUsers = list;
      renderPodium(filteredUsers.slice(0, 3));
      lbCurrentPage = 1;
      renderTablePage(1);
    }

    function getRankPill(rank) {
      if (rank === 1) return '<span class="rank-pill rank-1"><i data-lucide="trophy" style="width:13px;height:13px;"></i> #1</span>';
      if (rank === 2) return '<span class="rank-pill rank-2"><i data-lucide="medal" style="width:13px;height:13px;"></i> #2</span>';
      if (rank === 3) return '<span class="rank-pill rank-3"><i data-lucide="medal" style="width:13px;height:13px;"></i> #3</span>';
      return '<span class="rank-pill rank-other">#' + rank + '</span>';
    }

    function avatarEl(u, cls) {
      const letter = (u.displayName || 'P').charAt(0).toUpperCase();
      return u.photoURL
        ? '<div class="' + cls + '"><img src="' + escapeHtml(u.photoURL) + '" onerror="this.style.display=\'none\'"/></div>'
        : '<div class="' + cls + '">' + letter + '</div>';
    }

    function renderPodium(top3) {
      const podiumEl = document.getElementById('podium-wrap');
      if (!podiumEl) return;

      if (!top3 || !top3.length) {
        podiumEl.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>No ranked champions yet</p></div>';
        return;
      }

      // Arrange order for podium: 2nd place on left, 1st in center, 3rd on right
      const order = [top3[1], top3[0], top3[2]].filter(Boolean);
      const posMap = { 0: 2, 1: 1, 2: 3 };

      podiumEl.innerHTML = order.map((u, i) => {
        const rank = u === top3[0] ? 1 : (u === top3[1] ? 2 : 3);
        const pos = rank;
        const isCurrent = u.id === currentUser?.uid;
        const wins = Number(u.matchesWon || 0);
        const played = Number(u.matchesPlayed || 0);
        const wr = played > 0 ? (Math.round((wins / played) * 100) + '%') : '0%';
        const earned = Number(u.totalEarned || 0);

        return '<a href="profile?uid=' + encodeURIComponent(u.id) + '" class="podium-card podium-card--' + pos + (isCurrent ? ' current-user' : '') + '" title="View ' + escapeHtml(u.displayName || 'Player') + '\'s Profile">' +
          getRankPill(rank) +
          avatarEl(u, 'podium-avatar-wrap podium-avatar-wrap--' + pos) +
          '<div style="min-width:0;width:100%;">' +
            '<div style="font-weight:900;font-size:1.05rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
              escapeHtml(u.displayName || 'Unknown') +
              (isCurrent ? ' <span style="color:var(--gold-bright);font-size:0.75rem;font-weight:800;">(You)</span>' : '') +
            '</div>' +
            (u.epicUsername ? '<div style="margin-top:4px;"><span class="badge" style="background:rgba(0,120,242,0.15);color:#38bdf8;border:1px solid rgba(0,120,242,0.3);font-size:0.72rem;padding:2px 7px;"><i data-lucide="gamepad-2" style="width:11px;height:11px;"></i> ' + escapeHtml(u.epicUsername) + '</span></div>' : '') +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:3px;align-items:center;margin-top:2px;">' +
            '<div style="font-size:1.3rem;font-weight:900;color:var(--gold-bright);display:inline-flex;align-items:center;gap:6px;">' +
              '<i data-lucide="trophy" style="width:17px;height:17px;color:var(--gold-bright);"></i> ' + wins + ' Wins' +
            '</div>' +
            '<div style="font-size:0.75rem;color:var(--text-muted);">' +
              played + ' matches · ' + wr + ' win rate' +
            '</div>' +
            '<div style="font-size:0.8rem;font-weight:800;color:#fff;margin-top:4px;display:inline-flex;align-items:center;gap:5px;">' +
              '<img src="new_token.png" alt="CT" style="width:15px;height:15px;object-fit:contain;"/> ' + formatTokens(earned) + ' Tokens' +
            '</div>' +
          '</div>' +
        '</a>';
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    function renderTablePage(page) {
      lbCurrentPage = page;
      const tbody = document.getElementById('lb-tbody');
      if (!tbody) return;

      const totalItems = filteredUsers.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / LB_PER_PAGE));
      const startIdx = (lbCurrentPage - 1) * LB_PER_PAGE;
      const pageUsers = filteredUsers.slice(startIdx, startIdx + LB_PER_PAGE);

      if (!pageUsers.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted);">No competitors found' + (lbSearchQuery ? ' matching "' + escapeHtml(lbSearchQuery) + '"' : '') + '</td></tr>';
        renderPaginationControls(totalPages);
        return;
      }

      tbody.innerHTML = pageUsers.map((u, idx) => {
        const rank = startIdx + idx + 1;
        const isCurrent = u.id === currentUser?.uid;
        const letter = (u.displayName || 'P').charAt(0).toUpperCase();
        const played = Number(u.matchesPlayed || 0);
        const won = Number(u.matchesWon || 0);
        const wr = played > 0 ? (Math.round((won / played) * 100) + '%') : '0%';
        const earned = Number(u.totalEarned || 0);

        return '<tr class="' + (isCurrent ? 'current-user' : '') + '" onclick="window.location.href=\'profile?uid=' + encodeURIComponent(u.id) + '\'" title="View Profile">' +
          '<td>' + getRankPill(rank) + '</td>' +
          '<td>' +
            '<div style="display:flex;align-items:center;gap:12px;">' +
              '<div style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;overflow:hidden;flex-shrink:0;">' +
                (u.photoURL ? '<img src="' + escapeHtml(u.photoURL) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'"/>' : letter) +
              '</div>' +
              '<div>' +
                '<div style="font-weight:800;font-size:0.95rem;color:#fff;">' +
                  escapeHtml(u.displayName || 'Unknown') +
                  (isCurrent ? ' <span style="font-size:0.75rem;color:var(--gold-bright);font-weight:800;">(You)</span>' : '') +
                  
                '</div>' +
                '<div style="font-size:0.74rem;color:var(--text-muted);display:flex;align-items:center;gap:8px;margin-top:2px;">' +
                  (u.epicUsername ? '<span style="color:#38bdf8;font-weight:700;"><i data-lucide="gamepad-2" style="width:11px;height:11px;display:inline;"></i> ' + escapeHtml(u.epicUsername) + '</span>' : '<span>Unlinked IGN</span>') +
                  (u.discordUsername ? '<span>@' + escapeHtml(u.discordUsername) + '</span>' : '') +
                '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td style="color:var(--gold-bright);font-weight:900;font-size:1.02rem;">' +
            '<span style="display:inline-flex;align-items:center;gap:5px;"><i data-lucide="trophy" style="width:14px;height:14px;"></i> ' + won + '</span>' +
          '</td>' +
          '<td style="color:#cbd5e1;font-weight:700;font-size:0.9rem;">' + played + '</td>' +
          '<td>' +
            '<span class="badge" style="background:rgba(255,255,255,0.05);color:#fff;font-weight:800;font-size:0.78rem;padding:3px 9px;">' +
              wr +
            '</span>' +
          '</td>' +
          '<td style="color:var(--gold-bright);font-weight:900;font-size:0.95rem;">' +
            '<span style="display:inline-flex;align-items:center;gap:6px;">' +
              '<img src="new_token.png" alt="CT" style="width:16px;height:16px;object-fit:contain;"/> ' + formatTokens(earned) +
            '</span>' +
          '</td>' +
        '</tr>';
      }).join('');

      renderPaginationControls(totalPages);
      if (window.lucide) lucide.createIcons();
    }

    function renderPaginationControls(totalPages) {
      const container = document.getElementById('lb-pagination');
      if (!container) return;

      container.innerHTML = 
        '<button class="ct-page-btn" onclick="renderTablePage(' + (lbCurrentPage - 1) + ')" ' + (lbCurrentPage <= 1 ? 'disabled' : '') + '>' +
          '<i data-lucide="chevron-left"></i> Previous' +
        '</button>' +
        '<span class="ct-page-info">Page ' + lbCurrentPage + ' of ' + totalPages + '</span>' +
        '<button class="ct-page-btn" onclick="renderTablePage(' + (lbCurrentPage + 1) + ')" ' + (lbCurrentPage >= totalPages ? 'disabled' : '') + '>' +
          'Next <i data-lucide="chevron-right"></i>' +
        '</button>';
      if (window.lucide) lucide.createIcons();
    }

    async function handleRefresh() {
      const btn = document.getElementById('refresh-btn');
      const icon = document.getElementById('refresh-icon');
      if (btn) btn.disabled = true;
      if (icon) icon.classList.add('spinning-icon');

      try {
        await loadLeaderboard();
        showToast('Leaderboard refreshed!', 'info');
      } catch (err) {
        showToast('Failed to refresh leaderboard', 'error');
      } finally {
        setTimeout(() => {
          if (icon) icon.classList.remove('spinning-icon');
          if (btn) btn.disabled = false;
        }, 500);
      }
    }
  </script>

  <main class="page-wrap" style="max-width: 1050px;">
    <!-- 1. Morphed Master Header & Stats Card -->
    <div class="lb-morphed-header-card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <h1 style="font-size:1.65rem;font-weight:900;margin:0;display:flex;align-items:center;gap:10px;color:#fff;">
            <i data-lucide="trophy" style="color:var(--gold-bright);width:26px;height:26px;"></i> Leaderboard
          </h1>
        </div>
        <div>
          <button class="btn btn-outline btn-sm" id="refresh-btn" onclick="handleRefresh()" style="display:inline-flex;align-items:center;gap:7px;background:#060608;border:1px solid rgba(255,255,255,0.1);padding:7px 16px;border-radius:10px;font-size:0.82rem;">
            <i data-lucide="refresh-cw" id="refresh-icon" style="width:14px;height:14px;"></i> <span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- Morphed Divider -->
      <div style="border-top:1px solid rgba(255,255,255,0.07);margin:20px 0 16px;"></div>

      <!-- Morphed Quick Stats Grid -->
      <div class="lb-stats-grid">
        <div class="lb-stat-card">
          <div class="lb-stat-icon-wrap" style="background:rgba(245,158,11,0.14);color:var(--gold-bright);">
            <i data-lucide="users" style="width:20px;height:20px;"></i>
          </div>
          <div>
            <div style="font-size:0.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Competitors</div>
            <div style="font-size:1.28rem;font-weight:900;color:#fff;" id="stat-total-players">0</div>
          </div>
        </div>

        <div class="lb-stat-card">
          <div class="lb-stat-icon-wrap" style="background:rgba(59,130,246,0.14);color:#60a5fa;">
            <i data-lucide="trophy" style="width:20px;height:20px;"></i>
          </div>
          <div>
            <div style="font-size:0.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Victories Won</div>
            <div style="font-size:1.28rem;font-weight:900;color:#fff;" id="stat-total-wins">0</div>
          </div>
        </div>

        <div class="lb-stat-card">
          <div class="lb-stat-icon-wrap" style="background:rgba(16,185,129,0.14);color:#34d399;">
            <i data-lucide="coins" style="width:20px;height:20px;"></i>
          </div>
          <div>
            <div style="font-size:0.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Tokens Earned</div>
            <div style="font-size:1.28rem;font-weight:900;color:var(--gold-bright);" id="stat-total-earned">0.00</div>
          </div>
        </div>

        <div class="lb-stat-card">
          <div class="lb-stat-icon-wrap" style="background:rgba(168,85,247,0.14);color:#c084fc;">
            <i data-lucide="target" style="width:20px;height:20px;"></i>
          </div>
          <div>
            <div style="font-size:0.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Top Win Rate</div>
            <div style="font-size:1.28rem;font-weight:900;color:#fff;" id="stat-top-winrate">0%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Top 3 Podium Showcase -->
    <div class="podium-section" id="podium-wrap">
      <div class="empty-state" style="grid-column:1/-1;"><div class="spinner" style="margin:0 auto;"></div></div>
    </div>

    <!-- 3. Standings Table Card -->
    <div class="lb-table-card">
      <!-- Search & Sort Controls Bar with ample height and clean layout -->
      <div class="lb-controls-bar">
        <div class="lb-search-input-wrap">
          <i data-lucide="search" class="lb-search-icon"></i>
          <input
            id="player-search-input"
            class="form-input lb-search-input"
            placeholder="Search players..."
            oninput="handleSearchLeaderboard(this.value)"
          />
        </div>

        <!-- Sort Tabs -->
        <div class="lb-sort-tabs-wrap">
          <button class="lb-sort-tab active" data-sort="wins" onclick="setSortMode('wins')">
            <i data-lucide="trophy" style="width:14px;height:14px;"></i> <span>Most Wins</span>
          </button>
          <button class="lb-sort-tab" data-sort="earnings" onclick="setSortMode('earnings')">
            <i data-lucide="coins" style="width:14px;height:14px;"></i> <span>Top Earnings</span>
          </button>
          <button class="lb-sort-tab" data-sort="winrate" onclick="setSortMode('winrate')">
            <i data-lucide="percent" style="width:14px;height:14px;"></i> <span>Win Rate</span>
          </button>
        </div>
      </div>

      <!-- Table Wrap -->
      <div class="lb-table-wrap">
        <table class="lb-custom-table">
          <thead>
            <tr>
              <th style="width:80px;">Rank</th>
              <th>Player</th>
              <th>Wins</th>
              <th>Matches</th>
              <th>Win Rate</th>
              <th>Total Earned</th>
            </tr>
          </thead>
          <tbody id="lb-tbody">
            <tr><td colspan="6" style="text-align:center;padding:28px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination bar -->
      <div class="ct-pagination" id="lb-pagination" style="margin-top:18px;"></div>
    </div>
  </main>
</body>
</html>
