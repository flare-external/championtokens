[build]
  command   = "npm install"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Global Security & HSTS Headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# ── Source Code & Sensitive Files Protection (404/403 Block) ──
[[redirects]]
  from   = "/.git/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/worker.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/package.json"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/package-lock.json"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
