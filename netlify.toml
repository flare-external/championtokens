[build]
  command   = "npm install"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Global Security & HSTS Headers (Forces browser into HTTPS)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"

# Clean URLs (serve /page without .html extension)
[[redirects]]
  from   = "/dashboard"
  to     = "/dashboard.html"
  status = 200

[[redirects]]
  from   = "/matches"
  to     = "/matches.html"
  status = 200

