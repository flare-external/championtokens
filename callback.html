<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="shortcut icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="apple-touch-icon" href="champion-tokens_new.png"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="css/style.css?v=4.0.1788156016116"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .minimal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .white-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: pureSpin 0.75s linear infinite;
    }
    @keyframes pureSpin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.02em;
    }
    .error-card {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 420px;
      background: rgba(18, 24, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 28px 24px;
    }
    .error-msg-box {
      font-size: 0.82rem;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 14px;
      border-radius: 10px;
      word-break: break-word;
      font-family: monospace;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-back:hover { opacity: 0.85; }
  </style>
  <script src="js/protect.js"></script>
</head>
<body>
  <div class="minimal-wrap">
    <!-- Loading state -->
    <div id="loading-state" style="display:flex;flex-direction:column;align-items:center;gap:18px;">
      <div class="white-spinner"></div>
      <div class="loading-text">Logging in…</div>
    </div>

    <!-- Error state -->
    <div id="error-state" class="error-card">
      <div style="font-size:1.1rem;font-weight:800;color:#ffffff;">Sign-in Error</div>
      <div class="error-msg-box" id="error-msg">Authentication failed.</div>
      <a href="index.html" class="btn-back">
        <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Back to Home
      </a>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js?v=3.5"></script>
  <script src="js/db.js?v=4.0.1788156016116"></script>
  <script src="js/auth.js?v=4.0.1788156016116"></script>

  <script>
    window.onerror = function(msg, url, line) {
      showError(`Runtime error: ${msg} (line ${line})`);
    };
    window.onunhandledrejection = function(e) {
      showError(e.reason?.message || String(e.reason || 'Unhandled network error'));
    };

    function showError(msg) {
      const loading = document.getElementById('loading-state');
      if (loading) loading.style.display = 'none';
      
      const errEl = document.getElementById('error-state');
      if (errEl) {
        errEl.style.display = 'flex';
        const msgEl = document.getElementById('error-msg');
        if (msgEl) msgEl.textContent = msg;
      }
      if (window.lucide) {
        try { lucide.createIcons(); } catch(e) {}
      }
    }

    async function handleCallback() {
      if (window.lucide) {
        try { lucide.createIcons(); } catch(e) {}
      }

      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');

      // Discord sent back an error (e.g. user denied access)
      if (error) {
        showError(error === 'access_denied'
          ? 'You cancelled the Discord sign-in.'
          : `Discord error: ${error}`);
        return;
      }

      if (!code) {
        showError('No authorization code received from Discord.');
        return;
      }

      try {
        // Quick check if auth already active
        await new Promise((resolve) => {
          let done = false;
          const t = setTimeout(() => { if (!done) { done = true; resolve(null); } }, 800);
          const unsub = auth.onAuthStateChanged((u) => {
            if (!done) { done = true; clearTimeout(t); unsub(); resolve(u); }
          });
        });

        // Exchange Discord OAuth Code for Firebase Token
        await exchangeDiscordCode(code);

        // Success - clean URL and redirect to dashboard
        window.history.replaceState({}, '', window.location.pathname);
        window.location.href = 'dashboard';

      } catch (err) {
        console.error('Callback error:', err);
        showError(err.message || String(err));
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      handleCallback();
    });
  </script>
</body>
</html>
