<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="shortcut icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="apple-touch-icon" href="champion_tokens_CT_v4.png"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .callback-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 999;
    }
    .callback-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .callback-brand i { width: 26px; height: 26px; color: var(--gold-bright, #f59e0b); }
    .callback-brand .brand-accent { color: var(--gold-bright, #f59e0b); }

    .callback-card {
      background: #0d1222;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      position: relative;
      z-index: 1000;
    }
    .callback-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .callback-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
    .callback-desc  { font-size: 0.9rem; color: #94a3b8; }
    .error-msg-box {
      font-size: 0.85rem;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 12px 16px;
      border-radius: 12px;
      word-break: break-word;
      width: 100%;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>

  <div class="callback-wrap">
    <div class="callback-brand">
      <i data-lucide="shield"></i>
      Champion <span class="brand-accent">Tokens</span>
    </div>

    <div class="callback-card">
      <!-- Loading state -->
      <div id="loading-state" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;">
        <div class="callback-spinner"></div>
        <div class="callback-title">Signing you in…</div>
        <div class="callback-desc">Verifying your Discord account, hang tight.</div>
      </div>

      <!-- Error state -->
      <div id="error-state" style="display:none;flex-direction:column;align-items:center;gap:14px;width:100%;">
        <i data-lucide="alert-triangle" style="width:44px;height:44px;color:#ef4444;"></i>
        <div class="callback-title">Sign-in Notice</div>
        <div class="error-msg-box" id="error-msg">Something went wrong. Please try again.</div>
        <a href="index.html" class="btn btn-primary" style="margin-top:10px;width:100%;justify-content:center;">
          <i data-lucide="arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js?v=3.5"></script>
  <script src="js/auth.js?v=3.5"></script>

  <script>
    window.onerror = function(msg, url, line) {
      showError(`Runtime error: ${msg} (line ${line})`);
    };
    window.onunhandledrejection = function(e) {
      showError(e.reason?.message || String(e.reason || 'Unhandled network error'));
    };

    function showError(msg) {
      const loading = document.getElementById('loading-state');
      if (loading) loading.style.display = 'none';
      
      const errEl = document.getElementById('error-state');
      if (errEl) {
        errEl.style.display = 'flex';
        const msgEl = document.getElementById('error-msg');
        if (msgEl) msgEl.textContent = msg;
      }
      if (window.lucide) {
        try { lucide.createIcons(); } catch(e) {}
      }
    }

    async function handleCallback() {
      if (window.lucide) {
        try { lucide.createIcons(); } catch(e) {}
      }

      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');

      // Discord sent back an error (e.g. user denied access)
      if (error) {
        showError(error === 'access_denied'
          ? 'You cancelled the Discord sign-in.'
          : `Discord error: ${error}`);
        return;
      }

      if (!code) {
        showError('No authorization code received from Discord.');
        return;
      }

      try {
        // Quick check if auth already active
        await new Promise((resolve) => {
          let done = false;
          const t = setTimeout(() => { if (!done) { done = true; resolve(null); } }, 800);
          const unsub = auth.onAuthStateChanged((u) => {
            if (!done) { done = true; clearTimeout(t); unsub(); resolve(u); }
          });
        });

        // Exchange Discord OAuth Code for Firebase Token
        await exchangeDiscordCode(code);

        // Success - clean URL and redirect to dashboard
        window.history.replaceState({}, '', window.location.pathname);
        window.location.href = 'dashboard';

      } catch (err) {
        console.error('Callback error:', err);
        showError(err.message || String(err));
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      handleCallback();
    });
  </script>
</body>
</html>
