<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="shortcut icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="apple-touch-icon" href="champion_tokens_CT_v4.png"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    .callback-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 20px;
    }
    .callback-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .callback-brand i { width: 26px; height: 26px; color: var(--accent); }
    .callback-brand .brand-accent { color: var(--accent); }

    .callback-card {
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-xl);
      padding: 40px 48px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .callback-spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border-bright);
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .callback-title { font-size: 1.1rem; font-weight: 700; }
    .callback-desc  { font-size: 0.875rem; color: var(--text-muted); }
    .callback-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .callback-error i { width: 40px; height: 40px; color: var(--red); }
    .callback-error .error-msg { font-size: 0.875rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="page-bg"></div>

  <div class="callback-wrap">
    <div class="callback-brand">
      <i data-lucide="shield"></i>
      Champion <span class="brand-accent">Tokens</span>
    </div>

    <div class="callback-card">
      <!-- Loading state -->
      <div id="loading-state">
        <div class="callback-spinner"></div>
        <div class="callback-title">Signing you in…</div>
        <div class="callback-desc">Verifying your Discord account, hang tight.</div>
      </div>

      <!-- Error state -->
      <div id="error-state" style="display:none;flex-direction:column;align-items:center;gap:12px;">
        <i data-lucide="x-circle" style="width:40px;height:40px;color:var(--red);"></i>
        <div class="callback-title">Sign-in failed</div>
        <div class="callback-desc" id="error-msg">Something went wrong. Please try again.</div>
        <a href="index.html" class="btn btn-outline" style="margin-top:8px;">
          <i data-lucide="arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/firebase-config.js?v=3.5"></script>
  <script src="js/auth.js?v=3.5"></script>

  <script>
    lucide.createIcons();

    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');

      // Discord sent back an error (user denied)
      if (error) {
        showError(error === 'access_denied'
          ? 'You cancelled the Discord sign-in.'
          : `Discord error: ${error}`);
        return;
      }

      if (!code) {
        showError('No authorization code received from Discord.');
        return;
      }

      try {
        // Check if already signed in with safety timeout
        await new Promise((resolve) => {
          let settled = false;
          const timer = setTimeout(() => {
            if (!settled) { settled = true; resolve(null); }
          }, 1200);
          const unsub = auth.onAuthStateChanged((user) => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              unsub();
              resolve(user);
            }
          });
        });

        await exchangeDiscordCode(code);

        // Clean the URL and redirect
        window.history.replaceState({}, '', window.location.pathname);
        window.location.href = 'dashboard';

      } catch (err) {
        console.error('Callback error:', err);
        showError(err.message || 'Authentication failed. Please try again.');
      }
    }

    function showError(msg) {
      document.getElementById('loading-state').style.display = 'none';
      const errEl = document.getElementById('error-state');
      errEl.style.display = 'flex';
      document.getElementById('error-msg').textContent = msg;
      lucide.createIcons();
    }

    handleCallback();
  </script>
</body>
</html>
