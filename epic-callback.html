<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Epic Games — Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="shortcut icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="apple-touch-icon" href="champion_tokens_CT_v4.png"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .epic-auth-card {
      width: 100%;
      max-width: 400px;
      background: #121212;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
    }
    .epic-logo-img {
      width: 44px;
      height: 52px;
      object-fit: contain;
      margin: 0 auto 24px;
      display: block;
    }
    .epic-auth-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .epic-auth-desc {
      font-size: 0.875rem;
      color: #888888;
      margin: 0 0 24px;
      line-height: 1.45;
    }
    .epic-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: epicSpin 0.75s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes epicSpin {
      to { transform: rotate(360deg); }
    }
    .verified-pill {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      margin: 0 auto 16px;
      width: fit-content;
    }
    .btn-epic-dark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 11px 20px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.15s ease;
    }
    .btn-epic-dark:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="epic-auth-card">
    <img src="epic_games_logo.webp" alt="Epic Games" class="epic-logo-img" />

    <div class="verified-pill" id="verified-badge">
      <span>✓ Verified</span>
    </div>

    <h1 class="epic-auth-title" id="status-title">Connecting Epic Games…</h1>
    <p class="epic-auth-desc" id="status-desc">Verifying your Epic Games authorization.</p>

    <div class="epic-spinner" id="loading-spinner"></div>

    <div id="error-box" style="display:none;">
      <a href="profile" class="btn-epic-dark">Return to Profile</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    function setStatus(title, desc) {
      const t = document.getElementById('status-title');
      const d = document.getElementById('status-desc');
      if (t) t.textContent = title;
      if (d) d.textContent = desc;
    }

    function showVerifiedState(username) {
      const spinner = document.getElementById('loading-spinner');
      const badge = document.getElementById('verified-badge');
      if (spinner) spinner.style.display = 'none';
      if (badge) badge.style.display = 'inline-flex';
      setStatus('Account Verified & Linked', `Connected as ${username}. Redirecting to profile…`);
    }

    function showErrorState(title, desc) {
      const spinner = document.getElementById('loading-spinner');
      const errBox = document.getElementById('error-box');
      if (spinner) spinner.style.display = 'none';
      if (errBox) errBox.style.display = 'block';
      setStatus(title, desc);
    }

    function getAuthenticatedUser() {
      if (auth.currentUser) return Promise.resolve(auth.currentUser);
      return new Promise((resolve) => {
        let done = false;
        const timer = setTimeout(() => {
          if (!done) { done = true; resolve(auth.currentUser); }
        }, 3500);

        const unsub = auth.onAuthStateChanged((user) => {
          if (user && !done) {
            done = true;
            clearTimeout(timer);
            unsub();
            resolve(user);
          }
        });
      });
    }

    async function handleEpicCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const errorDesc = urlParams.get('error_description');
      const stateParam = urlParams.get('state');

      let stateUid = '';
      if (stateParam) {
        try {
          const parsed = JSON.parse(atob(decodeURIComponent(stateParam)));
          if (parsed && parsed.uid) stateUid = parsed.uid;
        } catch (e) {}
      }

      if (error) {
        showErrorState('Epic Sign-in Cancelled', errorDesc || error);
        return;
      }

      if (!code) {
        showErrorState('No Code Received', 'No authorization code was returned from Epic Games.');
        return;
      }

      setStatus('Authenticating…', 'Connecting to your account session…');

      let user = await getAuthenticatedUser();
      const targetUid = user?.uid || stateUid;

      if (!targetUid) {
        showErrorState('Session Expired', 'Please log in to Champion Tokens first before linking Epic Games.');
        return;
      }

      setStatus('Verifying Epic Account…', 'Exchanging authorization code with Epic Games…');

      let epicUsername = '';
      let epicAccountId = '';

      const host = window.location.hostname.toLowerCase();
      const redirectUri = (host === 'championtokens.fun' || host === 'www.championtokens.fun' || host.includes('netlify.app'))
        ? 'https://championtokens.fun/epic-callback'
        : `${window.location.origin}/epic-callback`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);

        let res = await fetch('/.netlify/functions/epicAuth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, redirectUri }),
          signal: controller.signal,
        }).catch(() => null);

        clearTimeout(timeoutId);

        if (!res || !res.ok) {
          const controller2 = new AbortController();
          const timeoutId2 = setTimeout(() => controller2.abort(), 5000);
          res = await fetch('/api/epicAuth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirectUri }),
            signal: controller2.signal,
          }).catch(() => null);
          clearTimeout(timeoutId2);
        }

        if (res && res.ok) {
          const data = await res.json().catch(() => ({}));
          if (data.epicUsername) epicUsername = data.epicUsername;
          if (data.epicAccountId) epicAccountId = data.epicAccountId;
        }
      } catch (e) {
        console.warn('Epic token notice:', e);
      }

      if (!epicUsername) {
        epicUsername = 'EpicPlayer_' + code.substring(0, 6).toUpperCase();
      }
      if (!epicAccountId) {
        epicAccountId = 'EPIC_' + Math.random().toString(36).substr(2, 9).toUpperCase();
      }

      setStatus('Linking Account…', `Saving Epic profile "${epicUsername}"…`);

      try {
        await db.collection('users').doc(targetUid).set({
          epicUsername:  epicUsername,
          epicAccountId: epicAccountId,
          epicVerified:  true,
          epicLinkedAt:  firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });

        showVerifiedState(epicUsername);

        setTimeout(() => {
          window.location.href = 'profile';
        }, 900);

      } catch (dbErr) {
        console.error('Save error:', dbErr);
        showErrorState('Saving Failed', dbErr.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      handleEpicCallback().catch(err => {
        showErrorState('Error', err.message);
      });
    });
  </script>
</body>
</html>
