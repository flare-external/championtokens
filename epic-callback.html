<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="shortcut icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="apple-touch-icon" href="champion_tokens_CT_v4.png"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #121212;
      color: #fff;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .callback-box {
      max-width: 440px;
      padding: 36px 28px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: var(--radius-xl);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="callback-box">
    <img src="epic_games_logo.webp" alt="Epic Games" style="width:48px;height:58px;object-fit:contain;margin:0 auto 16px;display:block;" />
    <h2 id="status-title" style="font-size:1.4rem;font-weight:900;margin-bottom:8px;">Verifying with Epic Games…</h2>
    <p id="status-desc" style="font-size:0.875rem;color:var(--text-muted);margin-bottom:20px;">
      Exchanging authorization code with Epic Games Account Services.
    </p>
    <div class="spinner" id="spinner" style="margin:0 auto;"></div>
    <div id="error-actions" style="display:none;margin-top:20px;">
      <a href="profile" class="btn btn-outline btn-sm">Return to Profile</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');
    const errorDesc = urlParams.get('error_description');

    if (error) {
      document.getElementById('status-title').textContent = 'Epic Sign-in Failed';
      document.getElementById('status-desc').textContent = errorDesc || error;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('error-actions').style.display = 'block';
    } else if (!code) {
      document.getElementById('status-title').textContent = 'No Code Received';
      document.getElementById('status-desc').textContent = 'No authorization code returned from Epic Games.';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('error-actions').style.display = 'block';
    } else {
      // Exchange code
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          document.getElementById('status-title').textContent = 'Session Expired';
          document.getElementById('status-desc').textContent = 'Please log in to Champion Tokens first before linking Epic Games.';
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('error-actions').style.display = 'block';
          return;
        }

        try {
          const redirectUri = `${window.location.origin}/epic-callback`;
          let res = await fetch('/.netlify/functions/epicAuth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirectUri }),
          }).catch(() => null);

          if (!res || !res.ok) {
            res = await fetch('/api/epicAuth', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code, redirectUri }),
            });
          }

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to exchange Epic token');

          // Write verified Epic Account info to user's Firestore doc
          await db.collection('users').doc(user.uid).update({
            epicUsername:  data.epicUsername,
            epicAccountId: data.epicAccountId || '',
            epicVerified:  true,
            epicLinkedAt:  firebase.firestore.FieldValue.serverTimestamp(),
          });

          document.getElementById('status-title').textContent = 'Epic Account Linked!';
          document.getElementById('status-desc').textContent = `Successfully linked as "${data.epicUsername}". Redirecting to profile…`;

          setTimeout(() => {
            window.location.href = 'profile';
          }, 1200);

        } catch (err) {
          console.error(err);
          document.getElementById('status-title').textContent = 'Verification Failed';
          document.getElementById('status-desc').textContent = err.message;
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('error-actions').style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
