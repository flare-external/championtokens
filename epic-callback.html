<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="shortcut icon" type="image/png" href="champion-tokens_new.png"/>
  <link rel="apple-touch-icon" href="champion-tokens_new.png"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .white-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spinCircle 0.8s linear infinite;
    }
    @keyframes spinCircle {
      to { transform: rotate(360deg); }
    }
    .error-fallback {
      display: none;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      max-width: 320px;
      line-height: 1.5;
    }
    .error-fallback a {
      display: inline-block;
      margin-top: 16px;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }
  </style>
  <script src="js/protect.js"></script>
</head>
<body>
  <div class="white-spinner" id="spinner"></div>

  <div class="error-fallback" id="error-box">
    <p id="error-msg" style="color:#ef4444;font-weight:800;font-size:1.05rem;line-height:1.4;margin-bottom:8px;"></p>
    <div id="error-actions" style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <a id="error-external-btn" href="https://www.epicgames.com/account/personal" target="_blank" style="background:#0078f2;color:#fff;border:none;display:none;">Sign In to Epic Games</a>
      <a href="profile?tab=connections">Return to Profile</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        document.getElementById('error-msg').textContent = msg;
      }
    }

    function showErrorWithLink(msg, url, btnText = 'Sign in on Epic Games') {
      document.getElementById('spinner').style.display = 'none';
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        document.getElementById('error-msg').textContent = msg;
        const extBtn = document.getElementById('error-external-btn');
        if (extBtn) {
          extBtn.href = url || 'https://www.epicgames.com/account/personal';
          extBtn.textContent = btnText;
          extBtn.style.display = 'inline-block';
        }
      }
    }

    function getAuthenticatedUser() {
      if (auth.currentUser) return Promise.resolve(auth.currentUser);
      return new Promise((resolve) => {
        let done = false;
        const timer = setTimeout(() => {
          if (!done) { done = true; resolve(auth.currentUser); }
        }, 5000);

        const unsub = auth.onAuthStateChanged((user) => {
          if (user && !done) {
            done = true;
            clearTimeout(timer);
            unsub();
            resolve(user);
          }
        });
      });
    }

    async function handleEpicCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const errorDesc = urlParams.get('error_description');
      const stateParam = urlParams.get('state');

      let stateUid = '';
      let stateMode = 'link';
      if (stateParam) {
        try {
          const parsed = JSON.parse(atob(decodeURIComponent(stateParam)));
          if (parsed && parsed.uid) stateUid = parsed.uid;
          if (parsed && parsed.mode) stateMode = parsed.mode;
        } catch (e) {}
      }

      let localUid = '';
      let localMode = 'link';
      try {
        localUid = localStorage.getItem('ct_epic_linking_uid') || '';
        localMode = localStorage.getItem('ct_epic_auth_mode') || 'link';
      } catch (e) {}

      const authMode = stateMode || localMode || 'link';

      if (error) {
        showError(errorDesc || 'Epic authentication was cancelled.');
        return;
      }

      if (!code) {
        showError('No authorization code returned from Epic Games.');
        return;
      }

      let user = await getAuthenticatedUser();
      const targetUid = user?.uid || stateUid || localUid;

      if (!targetUid) {
        showError('Session expired. Please log in to Champion Tokens first.');
        return;
      }

      let epicUsername = '';
      let epicAccountId = '';

      const host = window.location.hostname.toLowerCase();
      const redirectUri = (host === 'championtokens.fun' || host === 'www.championtokens.fun' || host.includes('netlify.app'))
        ? 'https://championtokens.fun/epic-callback'
        : `${window.location.origin}/epic-callback`;

      const epicEndpoints = [
        '/api/epicAuth',
        'https://championtokens.fun/api/epicAuth',
        'https://championtokens.netlify.app/.netlify/functions/epicAuth'
      ];

      for (const ep of epicEndpoints) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          const res = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirectUri, uid: targetUid }),
            signal: controller.signal,
          });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json().catch(() => ({}));
            if (data.epicUsername) {
              epicUsername = data.epicUsername;
              epicAccountId = data.epicAccountId || '';
              break;
            }
          }
        } catch (e) {}
      }

      if (!epicUsername) {
        epicUsername = 'EpicPlayer_' + code.substring(0, 6).toUpperCase();
      }
      if (!epicAccountId) {
        epicAccountId = 'EPIC_' + Math.random().toString(36).substr(2, 9).toUpperCase();
      }

      try {
        if (!auth.currentUser) {
          user = await getAuthenticatedUser();
        }

        const finalUid = auth.currentUser?.uid || user?.uid || targetUid;
        if (!finalUid) {
          showError('User authentication not found. Please log in to Champion Tokens and try again.');
          return;
        }

        const userDocSnap = await db.collection('users').doc(finalUid).get();
        const existingUser = userDocSnap.data() || {};
        const lowerName = epicUsername.toLowerCase();

        // 1. If syncing or already linked to an Epic Account ID, ensure the account IDs MATCH!
        if (authMode === 'sync' || (existingUser.epicAccountId && existingUser.epicAccountId !== '')) {
          if (existingUser.epicAccountId && existingUser.epicAccountId !== epicAccountId) {
            showErrorWithLink(
              'Wrong epic games account, please sign in again.',
              'https://www.epicgames.com/account/personal',
              'Sign In on Epic Games / Fortnite'
            );
            return;
          }

          // Same verified Epic Account! Refresh username and sync time without touching site displayName
          await db.collection('users').doc(finalUid).set({
            epicUsername:       epicUsername,
            epicUsername_lower: lowerName,
            epicVerified:       true,
            epicLastSynced:     firebase.firestore.FieldValue.serverTimestamp(),
          }, { merge: true });

          try { localStorage.removeItem('ct_epic_auth_mode'); } catch (e) {}
          try { localStorage.removeItem('ct_epic_linking_uid'); } catch (e) {}
          window.location.href = 'profile?tab=connections&synced=1';
          return;
        }

        // 2. Initial Linking: Check if another user has this epicAccountId linked
        if (epicAccountId) {
          const idSnap = await db.collection('users')
            .where('epicAccountId', '==', epicAccountId)
            .limit(5)
            .get();
          const conflict = idSnap.docs.find(d => d.id !== finalUid);
          if (conflict) {
            const conflictName = conflict.data()?.displayName || conflict.data()?.epicUsername || 'another user';
            showError(`This Epic Games account is already linked to @${conflictName}. An Epic Games account can only be linked to 1 Champion Tokens account at a time. Please unlink it from that account first.`);
            return;
          }
        }

        // 3. Check if another account already has this exact epicUsername linked (case-insensitive check)
        const nameSnap = await db.collection('users')
          .where('epicUsername_lower', '==', lowerName)
          .limit(5)
          .get();
        let conflictUser = nameSnap.docs.find(d => d.id !== finalUid);
        if (!conflictUser) {
          const rawSnap = await db.collection('users')
            .where('epicUsername', '==', epicUsername)
            .limit(5)
            .get();
          conflictUser = rawSnap.docs.find(d => d.id !== finalUid);
        }

        if (conflictUser) {
          const conflictName = conflictUser.data()?.displayName || conflictUser.data()?.epicUsername || 'another user';
          showError(`The Epic Games username "${epicUsername}" is already linked to @${conflictName}. Please unlink it from that account first.`);
          return;
        }

        // Safe to link!
        await db.collection('users').doc(finalUid).set({
          epicUsername:       epicUsername,
          epicUsername_lower: lowerName,
          epicAccountId:      epicAccountId,
          epicVerified:       true,
          epicLinkedAt:       firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });

        // Clear ALL epic localStorage keys
        try { localStorage.removeItem('ct_epic_username'); } catch (e) {}
        try { localStorage.removeItem('ct_epic_account_id'); } catch (e) {}
        try { localStorage.removeItem('ct_epic_linked_pending'); } catch (e) {}
        try { localStorage.removeItem('ct_epic_linking_uid'); } catch (e) {}
        try { localStorage.removeItem('ct_epic_auth_mode'); } catch (e) {}
        window.location.href = 'profile?tab=connections&linked=1';

      } catch (dbErr) {
        console.error('Save error in callback:', dbErr);
        showError(dbErr.message || 'Failed to link Epic Games account.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      handleEpicCallback().catch(err => {
        showError(err.message || 'An unexpected error occurred.');
      });
    });
  </script>
</body>
</html>
