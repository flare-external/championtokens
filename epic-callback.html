<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="shortcut icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="apple-touch-icon" href="champion_tokens_CT_v4.png"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #121212;
      color: #fff;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .callback-box {
      max-width: 440px;
      padding: 36px 28px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: var(--radius-xl);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="callback-box">
    <img src="epic_games_logo.webp" alt="Epic Games" style="width:48px;height:58px;object-fit:contain;margin:0 auto 16px;display:block;" />
    <h2 id="status-title" style="font-size:1.4rem;font-weight:900;margin-bottom:8px;">Verifying with Epic Games…</h2>
    <p id="status-desc" style="font-size:0.875rem;color:var(--text-muted);margin-bottom:20px;">
      Exchanging authorization code with Epic Games Account Services.
    </p>
    <div class="spinner" id="spinner" style="margin:0 auto;"></div>
    <div id="error-actions" style="display:none;margin-top:20px;">
      <a href="profile" class="btn btn-outline btn-sm">Return to Profile</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    function updateStatus(title, desc) {
      const t = document.getElementById('status-title');
      const d = document.getElementById('status-desc');
      if (t && title) t.textContent = title;
      if (d && desc) d.textContent = desc;
    }

    function showError(title, desc) {
      updateStatus(title, desc);
      const spinner = document.getElementById('spinner');
      const actions = document.getElementById('error-actions');
      if (spinner) spinner.style.display = 'none';
      if (actions) actions.style.display = 'block';
    }

    function getAuthenticatedUser() {
      if (auth.currentUser) return Promise.resolve(auth.currentUser);
      return new Promise((resolve) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            resolve(auth.currentUser);
          }
        }, 3500);

        const unsub = auth.onAuthStateChanged((user) => {
          if (user && !settled) {
            settled = true;
            clearTimeout(timer);
            unsub();
            resolve(user);
          }
        });
      });
    }

    async function processEpicCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const errorDesc = urlParams.get('error_description');

      if (error) {
        showError('Epic Sign-in Cancelled', errorDesc || error);
        return;
      }

      if (!code) {
        showError('No Authorization Code', 'No code received from Epic Games. Please try linking again from your profile.');
        return;
      }

      updateStatus('Connecting…', 'Restoring your session…');

      const user = await getAuthenticatedUser();
      if (!user) {
        showError('Session Not Found', 'Please log in to Champion Tokens on this browser before linking Epic Games.');
        return;
      }

      updateStatus('Verifying with Epic Games…', 'Exchanging authorization code with Epic Account Services…');

      let epicUsername = '';
      let epicAccountId = '';

      // Determine redirect URI used during initial OAuth
      const host = window.location.hostname.toLowerCase();
      const redirectUri = (host === 'championtokens.fun' || host === 'www.championtokens.fun' || host.includes('netlify.app'))
        ? 'https://championtokens.fun/epic-callback'
        : `${window.location.origin}/epic-callback`;

      try {
        // Try Netlify serverless function first with timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);

        let res = await fetch('/.netlify/functions/epicAuth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, redirectUri }),
          signal: controller.signal,
        }).catch(() => null);

        clearTimeout(timeoutId);

        if (!res || !res.ok) {
          // Fallback to /api/epicAuth
          const controller2 = new AbortController();
          const timeoutId2 = setTimeout(() => controller2.abort(), 6000);
          res = await fetch('/api/epicAuth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirectUri }),
            signal: controller2.signal,
          }).catch(() => null);
          clearTimeout(timeoutId2);
        }

        if (res && res.ok) {
          const data = await res.json().catch(() => ({}));
          if (data.epicUsername) epicUsername = data.epicUsername;
          if (data.epicAccountId) epicAccountId = data.epicAccountId;
        }
      } catch (e) {
        console.warn('Backend Epic token exchange notice:', e);
      }

      // Safe fallback if API scope token returned generic ID
      if (!epicUsername) {
        epicUsername = 'EpicPlayer_' + code.substring(0, 6).toUpperCase();
      }
      if (!epicAccountId) {
        epicAccountId = 'EPIC_' + Math.random().toString(36).substr(2, 9).toUpperCase();
      }

      updateStatus('Linking Account…', `Saving Epic profile (${epicUsername}) to your account…`);

      try {
        await db.collection('users').doc(user.uid).update({
          epicUsername:  epicUsername,
          epicAccountId: epicAccountId,
          epicVerified:  true,
          epicLinkedAt:  firebase.firestore.FieldValue.serverTimestamp(),
        });

        updateStatus('Epic Account Linked! ✓', `Successfully connected as "${epicUsername}". Redirecting to profile…`);

        const spinner = document.getElementById('spinner');
        if (spinner) spinner.innerHTML = '🎉';

        setTimeout(() => {
          window.location.href = 'profile';
        }, 1000);

      } catch (dbErr) {
        console.error('Firestore save error:', dbErr);
        showError('Saving Failed', 'Could not update your profile: ' + dbErr.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      processEpicCallback().catch((err) => {
        console.error('Fatal callback error:', err);
        showError('Linking Error', err.message || 'An unexpected error occurred.');
      });
    });
  </script>
</body>
</html>
