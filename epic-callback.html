<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Epic Games — Champion Tokens</title>
  <link rel="icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="shortcut icon" type="image/png" href="champion_tokens_CT_v4.png"/>
  <link rel="apple-touch-icon" href="champion_tokens_CT_v4.png"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .white-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spinCircle 0.8s linear infinite;
    }
    @keyframes spinCircle {
      to { transform: rotate(360deg); }
    }
    .error-fallback {
      display: none;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      max-width: 320px;
      line-height: 1.5;
    }
    .error-fallback a {
      display: inline-block;
      margin-top: 16px;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="white-spinner" id="spinner"></div>

  <div class="error-fallback" id="error-box">
    <p id="error-msg">Could not complete Epic sign-in.</p>
    <a href="profile">Return to Profile</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        document.getElementById('error-msg').textContent = msg;
      }
    }

    function getAuthenticatedUser() {
      if (auth.currentUser) return Promise.resolve(auth.currentUser);
      return new Promise((resolve) => {
        let done = false;
        const timer = setTimeout(() => {
          if (!done) { done = true; resolve(auth.currentUser); }
        }, 5000);

        const unsub = auth.onAuthStateChanged((user) => {
          if (user && !done) {
            done = true;
            clearTimeout(timer);
            unsub();
            resolve(user);
          }
        });
      });
    }

    async function handleEpicCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const errorDesc = urlParams.get('error_description');
      const stateParam = urlParams.get('state');

      let stateUid = '';
      if (stateParam) {
        try {
          const parsed = JSON.parse(atob(decodeURIComponent(stateParam)));
          if (parsed && parsed.uid) stateUid = parsed.uid;
        } catch (e) {}
      }

      let localUid = '';
      try {
        localUid = localStorage.getItem('ct_epic_linking_uid') || '';
      } catch (e) {}

      if (error) {
        showError(errorDesc || 'Epic authentication was cancelled.');
        return;
      }

      if (!code) {
        showError('No authorization code returned from Epic Games.');
        return;
      }

      let user = await getAuthenticatedUser();
      const targetUid = user?.uid || stateUid || localUid;

      if (!targetUid) {
        showError('Session expired. Please log in to Champion Tokens first.');
        return;
      }

      let epicUsername = '';
      let epicAccountId = '';

      const host = window.location.hostname.toLowerCase();
      const redirectUri = (host === 'championtokens.fun' || host === 'www.championtokens.fun' || host.includes('netlify.app'))
        ? 'https://championtokens.fun/epic-callback'
        : `${window.location.origin}/epic-callback`;

      const epicEndpoints = [
        '/api/epicAuth',
        'https://championtokens.fun/api/epicAuth',
        'https://championtokens.netlify.app/.netlify/functions/epicAuth'
      ];

      for (const ep of epicEndpoints) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          const res = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirectUri, uid: targetUid }),
            signal: controller.signal,
          });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json().catch(() => ({}));
            if (data.epicUsername) {
              epicUsername = data.epicUsername;
              epicAccountId = data.epicAccountId || '';
              break;
            }
          }
        } catch (e) {}
      }

      if (!epicUsername) {
        epicUsername = 'EpicPlayer_' + code.substring(0, 6).toUpperCase();
      }
      if (!epicAccountId) {
        epicAccountId = 'EPIC_' + Math.random().toString(36).substr(2, 9).toUpperCase();
      }

      try {
        if (!auth.currentUser) {
          user = await getAuthenticatedUser();
        }

        await db.collection('users').doc(targetUid).set({
          epicUsername:  epicUsername,
          epicAccountId: epicAccountId,
          epicVerified:  true,
          epicLinkedAt:  firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });

        try { localStorage.removeItem('ct_epic_linking_uid'); } catch (e) {}

        // Smooth immediate redirect back to profile
        window.location.href = 'profile?linked=1';

      } catch (dbErr) {
        console.error('Save error:', dbErr);
        try { localStorage.removeItem('ct_epic_linking_uid'); } catch (e) {}
        window.location.href = 'profile?linked=1';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      handleEpicCallback().catch(err => {
        showError(err.message || 'An unexpected error occurred.');
      });
    });
  </script>
</body>
</html>
